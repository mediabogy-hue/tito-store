<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Balance Requests</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f2}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.ok{background:#111;color:#fff}.no{background:#eee}</style></head><body><main class="wrap"><h1>طلبات شحن BLNK Balance</h1><section id="login" class="card"><input id="email" type="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section><section id="panel" hidden><div id="rows"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{let cfg={};try{cfg=await fetch('/api/public-config').then(r=>r.ok?r.json():Promise.reject())}catch(e){};if(!cfg.supabaseUrl)cfg={supabaseUrl:'https://pdgbifhdskgosxgejwvk.supabase.co',supabasePublishableKey:'sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'};const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),q=s=>document.querySelector(s);async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const r=await sb.rpc('admin_topup_requests');q('#rows').innerHTML=(r.data||[]).map(x=>'<div class="card row"><div><b>'+x.customer_name+' · EGP '+Number(x.amount).toLocaleString()+'</b><p>'+x.method+' → '+x.destination_number+'</p><small>من: '+x.sender_number+' | العملية: '+x.transaction_reference+' | '+x.status+'</small></div>'+(x.status==='pending'?'<div><button class="button ok" data-a="approved" data-id="'+x.id+'">تأكيد وإضافة الرصيد</button> <button class="button no" data-a="rejected" data-id="'+x.id+'">رفض</button></div>':'')+'</div>').join('')||'<div class="card">لا توجد طلبات.</div>';document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{if(b.dataset.a==='approved'&&!confirm('تأكدت من وصول التحويل؟ سيتم إضافة الرصيد للعميل.'))return;const z=await sb.rpc('admin_review_topup',{p_request_id:b.dataset.id,p_action:b.dataset.a});if(z.error)alert(z.error.message);else load()})}q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};load()})();</script></body></html>
