<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Control — Sales</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f5f2;color:#111}.wrap{max-width:1280px;margin:auto;padding:24px}.top{background:#0b0b0b;color:#fff;padding:24px;border-radius:24px;margin-bottom:18px}.top h1{margin:4px 0;font-size:clamp(34px,6vw,68px);line-height:.95}.top .eyebrow{opacity:.7}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #e1e1dd;padding:22px;border-radius:20px;box-shadow:0 8px 30px rgba(0,0,0,.035)}.cards .card{min-height:125px;display:flex;flex-direction:column;justify-content:space-between}.cards small{font-weight:800;opacity:.55;text-transform:uppercase;letter-spacing:1px}.num{font-size:32px;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}.card label{display:block;font-weight:800;margin:14px 0 6px}.card input{width:100%;min-height:50px;padding:12px 14px;border:1px solid #bbb;border-radius:12px;background:#fff;font:inherit}.report-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}#reportBox{margin-top:16px;padding-top:6px}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><p class="eyebrow">BLNK / LIVE RETAIL</p><h1>Sales Dashboard</h1></div><div><a class="button button-dark" href="pos.html">POS</a> <a class="button button-light" href="admin.html">الإدارة</a></div></div><div id="login" class="card"><h2>دخول الإدارة</h2><input id="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></div><section id="dash" hidden><div class="cards"><div class="card"><small>مبيعات اليوم</small><div class="num" id="sales">0</div></div><div class="card"><small>الفواتير</small><div class="num" id="invoices">0</div></div><div class="card"><small>القطع</small><div class="num" id="items">0</div></div><div class="card"><small>ATV</small><div class="num" id="atv">0</div></div><div class="card"><small>UPT</small><div class="num" id="upt">0</div></div><div class="card"><small>ASP</small><div class="num" id="asp">0</div></div></div><div class="two"><div class="card"><h2>Target & Reports</h2><label>من<input id="from" type="date"></label><label>إلى<input id="to" type="date"></label><label>Target<input id="target" type="number" min="0" placeholder="مثال 300000"></label><div class="report-actions"><button id="saveTarget" class="button button-dark">حفظ Target</button><button id="report" class="button button-light">عرض التقرير</button></div><div id="reportBox"></div></div><div class="card"><h2>الشيفت</h2><label>Opening Cash<input id="opening" type="number" min="0" value="0"></label><p><button id="openShift" class="button button-dark">فتح الشيفت</button></p><label>Closing Cash<input id="closing" type="number" min="0" value="0"></label><p><button id="closeShift" class="button button-light">قفل الشيفت</button></p><div id="shiftMsg"></div></div></div><div class="two"><div class="card"><h2>أفضل المنتجات اليوم</h2><div id="top"></div></div><div class="card"><h2>Low Stock ≤ 3</h2><div id="low"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{let c={};try{c=await fetch('/api/public-config').then(r=>r.ok?r.json():Promise.reject())}catch(e){};if(!c.supabaseUrl)c={supabaseUrl:'https://pdgbifhdskgosxgejwvk.supabase.co',supabasePublishableKey:'sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'};const sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.querySelector(x),money=x=>'EGP '+Number(x||0).toLocaleString('en-US',{maximumFractionDigits:0});async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;$('#login').hidden=true;$('#dash').hidden=false;const r=await sb.rpc('admin_pos_dashboard');if(r.error)return;const d=r.data;$('#sales').textContent=money(d.sales_today);$('#invoices').textContent=d.invoices_today;$('#items').textContent=d.items_today;$('#atv').textContent=money(d.atv);$('#upt').textContent=Number(d.upt||0).toFixed(2);$('#asp').textContent=money(d.asp);$('#top').innerHTML=(d.top_products||[]).map(x=>'<div class="row"><b>'+x.product_name+'</b><span>'+x.qty+' pcs · '+money(x.sales)+'</span></div>').join('')||'لا توجد مبيعات اليوم';$('#low').innerHTML=(d.low_stock||[]).map(x=>'<div class="row"><b>'+x.product_id+'</b><span>'+x.stock+' pcs</span></div>').join('')||'المخزون جيد'}const today=new Date(),iso=x=>x.toISOString().slice(0,10);$('#from').value=iso(new Date(today.getFullYear(),today.getMonth(),1));$('#to').value=iso(today);$('#saveTarget').onclick=async()=>{const r=await sb.rpc('admin_set_sales_target',{p_start:$('#from').value,p_end:$('#to').value,p_target:Number($('#target').value||0)});$('#reportBox').textContent=r.error?r.error.message:'تم حفظ Target'};$('#report').onclick=async()=>{const from=$('#from').value,to=$('#to').value;if(!from||!to)return;const end=new Date(to+'T00:00:00');end.setDate(end.getDate()+1);const r=await sb.rpc('admin_sales_report_v2',{p_from:from,p_to:to});if(r.error)return $('#reportBox').textContent=r.error.message;const x=r.data;$('#reportBox').innerHTML='<div class="row"><span>إجمالي المبيعات</span><b>'+money(x.sales)+'</b></div><div class="row"><span>POS</span><b>'+money(x.pos_sales)+'</b></div><div class="row"><span>App</span><b>'+money(x.app_sales)+'</b></div><div class="row"><span>المعاملات</span><b>'+x.transactions+'</b></div><div class="row"><span>القطع</span><b>'+x.items+'</b></div><div class="row"><span>ATV</span><b>'+money(x.atv)+'</b></div><div class="row"><span>UPT</span><b>'+Number(x.upt||0).toFixed(2)+'</b></div><div class="row"><span>ASP</span><b>'+money(x.asp)+'</b></div><div class="row"><span>Target</span><b>'+money(x.target)+'</b></div><div class="row"><span>Achievement</span><b>'+Number(x.achievement||0).toFixed(1)+'%</b></div>'};$('#openShift').onclick=async()=>{const r=await sb.rpc('pos_open_shift',{p_opening_cash:Number($('#opening').value||0)});$('#shiftMsg').textContent=r.error?r.error.message:'تم فتح الشيفت'};$('#closeShift').onclick=async()=>{const r=await sb.rpc('pos_close_shift',{p_closing_cash:Number($('#closing').value||0)});$('#shiftMsg').textContent=r.error?r.error.message:'تم قفل الشيفت'};$('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(r.error)$('#msg').textContent='بيانات الدخول غير صحيحة';else load()};load();setInterval(load,60000)})();</script></body></html>
