<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Sales Dashboard</title><link rel="stylesheet" href="styles.css"><style>body{background:#efefed}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#fff;border:1px solid #ddd;padding:20px}.num{font-size:32px;font-weight:900}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="top"><div><p class="eyebrow">BLNK / LIVE RETAIL</p><h1>Sales Dashboard</h1></div><div><a class="button button-dark" href="pos.html">POS</a> <a class="button button-light" href="admin.html">الإدارة</a></div></div><div id="login" class="card"><h2>دخول الإدارة</h2><input id="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></div><section id="dash" hidden><div class="cards"><div class="card"><small>مبيعات اليوم</small><div class="num" id="sales">0</div></div><div class="card"><small>الفواتير</small><div class="num" id="invoices">0</div></div><div class="card"><small>القطع</small><div class="num" id="items">0</div></div><div class="card"><small>ATV</small><div class="num" id="atv">0</div></div><div class="card"><small>UPT</small><div class="num" id="upt">0</div></div><div class="card"><small>ASP</small><div class="num" id="asp">0</div></div></div><div class="two"><div class="card"><h2>أفضل المنتجات اليوم</h2><div id="top"></div></div><div class="card"><h2>Low Stock ≤ 3</h2><div id="low"></div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const c=await fetch('/api/public-config').then(r=>r.json()),sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=x=>document.querySelector(x),money=x=>'EGP '+Number(x||0).toLocaleString('en-US',{maximumFractionDigits:0});async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;$('#login').hidden=true;$('#dash').hidden=false;const r=await sb.rpc('admin_pos_dashboard');if(r.error)return;const d=r.data;$('#sales').textContent=money(d.sales_today);$('#invoices').textContent=d.invoices_today;$('#items').textContent=d.items_today;$('#atv').textContent=money(d.atv);$('#upt').textContent=Number(d.upt||0).toFixed(2);$('#asp').textContent=money(d.asp);$('#top').innerHTML=(d.top_products||[]).map(x=>'<div class="row"><b>'+x.product_name+'</b><span>'+x.qty+' pcs · '+money(x.sales)+'</span></div>').join('')||'لا توجد مبيعات اليوم';$('#low').innerHTML=(d.low_stock||[]).map(x=>'<div class="row"><b>'+x.product_id+'</b><span>'+x.stock+' pcs</span></div>').join('')||'المخزون جيد'}$('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(r.error)$('#msg').textContent='بيانات الدخول غير صحيحة';else load()};load();setInterval(load,60000)})();</script></body></html>
