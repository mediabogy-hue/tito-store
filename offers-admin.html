<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Offers Center</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f1}.wrap{max-width:980px;margin:auto;padding:22px}.hero{background:#0b0b0b;color:#fff;border-radius:24px;padding:26px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccc;border-radius:12px;font:inherit}textarea{min-height:150px}.wide{grid-column:1/-1}.preview{white-space:pre-wrap;background:#f5f5f2;border-radius:14px;padding:16px}.row{padding:12px 0;border-bottom:1px solid #eee}.tag{font-size:12px;border:1px solid #ccc;border-radius:99px;padding:4px 8px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="wrap"><div class="hero"><p>BLNK ADMIN</p><h1>Offers Center</h1><p>إنشاء عروض وتجهيز جمهور WhatsApp.</p></div><section id="login" class="card"><h2>دخول الإدارة</h2><input id="email" value="blnk@admin.com" type="email"><input id="pass" placeholder="كلمة المرور" type="password"><button id="go" class="button button-dark">دخول</button><p id="loginMsg"></p></section><section id="panel" hidden><div class="card"><div class="grid"><label>اسم الحملة<input id="title" placeholder="مثال: عرض نهاية الأسبوع"></label><label>WhatsApp Template<input id="template" placeholder="مثال: blnk_weekend_offer"></label><label>لغة القالب<select id="lang"><option value="ar">Arabic (ar)</option><option value="en_US">English (en_US)</option></select></label><label>الجمهور<input value="كل العملاء المسجل لهم WhatsApp" disabled></label><label class="wide">نص العرض<textarea id="message" placeholder="اكتب العرض هنا..."></textarea></label></div><h3>Preview</h3><div id="preview" class="preview">اكتب العرض ليظهر هنا.</div><p id="count"></p><button id="save" class="button button-dark">حفظ الحملة</button> <button id="prepare" class="button button-light" type="button">تجهيز إرسال WhatsApp</button><p id="msg"></p><div id="queue"></div></div><div class="card"><h2>الحملات</h2><div id="campaigns"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=supabase.createClient('https://pdgbifhdskgosxgejwvk.supabase.co','sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'),q=s=>document.querySelector(s);q('#message').oninput=()=>q('#preview').textContent=q('#message').value||'اكتب العرض ليظهر هنا.';async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const [r,c]=await Promise.all([sb.rpc('admin_offer_recipients'),sb.rpc('admin_offers')]);if(r.error){q('#count').textContent='شغّل ملف supabase/offers.sql أولاً.';return}q('#count').textContent='العملاء المتاح إرسال WhatsApp لهم: '+(r.data||[]).length;q('#campaigns').innerHTML=(c.data||[]).map(x=>'<div class="row"><b>'+x.title+'</b> <span class="tag">'+x.status+'</span><br><small>'+new Date(x.created_at).toLocaleString('ar-EG')+' · '+x.total_recipients+' عميل</small></div>').join('')||'<p>لا توجد حملات بعد.</p>'}q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#loginMsg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};q('#prepare').onclick=async()=>{const message=q('#message').value.trim();if(!message){q('#msg').textContent='اكتب نص العرض أولاً.';return}const r=await sb.rpc('admin_offer_recipients');if(r.error){q('#msg').textContent='تعذر تحميل العملاء: '+r.error.message;return}const clean=n=>{let v=String(n||'').replace(/[^0-9]/g,'');if(v.startsWith('0'))v='20'+v.slice(1);return v};q('#queue').innerHTML='<h3>إرسال للعملاء</h3>'+((r.data||[]).map(x=>'<div class="row"><b>'+x.full_name+'</b> · '+x.whatsapp+'<br><a class="button button-dark" target="_blank" rel="noopener" href="https://wa.me/'+clean(x.whatsapp)+'?text='+encodeURIComponent(message)+'">فتح الرسالة في WhatsApp</a></div>').join('')||'<p>لا يوجد عملاء بأرقام WhatsApp.</p>')};q('#save').onclick=async()=>{const title=q('#title').value.trim(),message=q('#message').value.trim();if(!title||!message){q('#msg').textContent='اكتب اسم الحملة ونص العرض.';return}const r=await sb.rpc('admin_create_offer',{p_title:title,p_message:message,p_template_name:q('#template').value.trim()||null,p_template_language:q('#lang').value});q('#msg').textContent=r.error?'تعذر الحفظ: '+r.error.message:'تم حفظ الحملة. استخدم زر تجهيز إرسال WhatsApp لفتح الرسالة لكل عميل.';if(!r.error)load()};load()})();</script></body></html>
