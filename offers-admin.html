<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK | حملات الموردين</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin-theme.css?v=20261014-1"><style>body{background:#f4f4f1}.wrap{max-width:1000px;margin:auto;padding:20px}.hero,.card{border-radius:20px;padding:20px;margin:14px 0}.hero{background:#111;color:white}.card{background:#fff;border:1px solid #ddd}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccc;border-radius:11px;font:inherit}textarea{min-height:180px}.preview,.row{white-space:pre-wrap;background:#f5f4ef;padding:14px;border-radius:12px;margin:10px 0;line-height:1.7}.actions{display:flex;gap:8px;flex-wrap:wrap}.tag{font-size:12px;border:1px solid #ccc;border-radius:99px;padding:3px 8px}.success{color:#08723f}.error{color:#b00020}</style></head>

<main class="wrap"><header class="hero"><p>BLNK OUTREACH</p><h1>حملة جذب الموردين والمصانع</h1><p>مسودة جاهزة، مع تجهيز رسالة WhatsApp منفصلة لكل مورد مسجل. الإرسال اليدوي يتم بعد مراجعة الرسالة لكل جهة.</p></header>
<section id="login" class="card"><h2>دخول الإدارة</h2><input id="email" type="email" value="blnk@admin.com"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginButton" class="button button-dark">دخول</button><p id="loginMessage"></p></section>
<div id="panel" hidden><section class="card"><label>الجمهور<select id="audience"><option value="suppliers">الموردون والمصانع</option><option value="customers">عملاء BLNK</option></select></label><label>اسم الحملة<input id="title" value="انضم لمعرض BLNK لتجار الجملة"></label><label>نص الرسالة<textarea id="message">السلام عليكم يا [اسم المورد]، معاك وليد من BLNK 👋

بنجهز معرض إلكتروني متخصص لتجار الجملة ومحلات الملابس الرجالي، يجمع موديلات وأسعار موردين ومصانع كتير في مكان واحد، ويسهّل على تجار التجزئة إنهم يشوفوا الصور والمقاسات والأسعار ويتواصلوا لطلب الكميات.

حابين نضيف منتجاتكم للمعرض. التسجيل وعرض المنتجات مجاني مبدئيًا، وإحنا بنراجع الصور والأسعار والمخزون قبل النشر. سعر العرض بيتحسب من سعر التوريد + ١٠ جنيه على القطعة، وبيظهر الحد الأدنى للطلب والمقاسات والألوان.

لو مهتم، ابعتلنا كتالوج الموديلات أو رابط قناة تيليجرام، ومعاه الأسعار والمقاسات والألوان والكميات المتاحة واسم المسؤول ورقم واتساب.

رابط معرض BLNK: https://blnkstore.vercel.app/
للتواصل: 01204107338

يسعدنا نضيفكم ونبدأ التعاون 🤝</textarea></label><h3>معاينة الرسالة</h3><div id="preview" class="preview"></div><p id="count"></p><div class="actions"><button id="save" class="button button-dark">حفظ الحملة كمسودة</button><button id="prepare" class="button button-light">تجهيز رسائل WhatsApp الفردية</button></div><p id="msg"></p><div id="queue"></div></section><section class="card"><h2>سجل الحملات</h2><div id="campaigns"></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{const c=await fetch('/api/public-config',{cache:'no-store'}).then(r=>r.json()),sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),q=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let session=null;function preview(){q('#preview').textContent=q('#message').value||'اكتب الرسالة للمعاينة.'}async function load(){session=(await sb.auth.getSession()).data.session;if(!session)return;const a=await sb.rpc('is_admin');if(a.error||a.data!==true)return;q('#login').hidden=true;q('#panel').hidden=false;const [r,camp]=await Promise.all([sb.rpc('admin_supplier_outreach_recipients'),sb.rpc('admin_offers')]);const list=r.data||[];q('#count').textContent='جهات الموردين المسجلة وبها رقم تواصل: '+list.length+'. الحملة تُحفظ كمسودة ولا ترسل تلقائيًا.';q('#campaigns').innerHTML=(camp.data||[]).map(x=>'<div class="row"><b>'+esc(x.title)+'</b> <span class="tag">'+esc(x.audience)+'</span> <span class="tag">'+esc(x.status)+'</span><br>'+new Date(x.created_at).toLocaleString('ar-EG')+' · '+Number(x.total_recipients||0)+' جهة<br>'+esc(x.message)+'</div>').join('')||'<p>لا توجد حملات محفوظة.</p>'}q('#message').oninput=preview;preview();q('#loginButton').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value.trim(),password:q('#password').value});q('#loginMessage').textContent=r.error?'بيانات الدخول غير صحيحة.':'';if(!r.error)load()};q('#save').onclick=async()=>{const title=q('#title').value.trim(),message=q('#message').value.trim();if(!title||!message){q('#msg').textContent='اكتب اسم الحملة والرسالة.';return}const aud=q('#audience').value;const r=aud==='suppliers'?await sb.rpc('admin_create_supplier_outreach',{p_title:title,p_message:message}):await sb.rpc('admin_create_offer',{p_title:title,p_message:message,p_template_name:null,p_template_language:'ar'});q('#msg').className=r.error?'error':'success';q('#msg').textContent=r.error?'تعذر الحفظ: '+r.error.message:'تم حفظ الحملة كمسودة.';if(!r.error)load()};q('#prepare').onclick=async()=>{const message=q('#message').value.trim();if(!message){q('#msg').textContent='اكتب الرسالة أولًا.';return}const aud=q('#audience').value;let data=[],r;if(aud==='suppliers'){r=await sb.rpc('admin_supplier_outreach_recipients');data=r.data||[]}else{r=await sb.rpc('admin_offer_recipients');data=r.data||[]}if(r.error){q('#msg').textContent='تعذر تحميل الجمهور: '+r.error.message;return}const clean=n=>{let v=String(n||'').replace(/[^0-9]/g,'');if(v.startsWith('0'))v='20'+v.slice(1);return v};q('#queue').innerHTML='<h3>رسائل فردية — راجع ثم أرسل يدويًا</h3>'+data.map(x=>{const name=x.business_name||x.full_name||'جهة',phone=x.whatsapp||'',personalized=message.replaceAll('[اسم المورد]',name);return '<div class="row"><b>'+esc(name)+'</b> · '+esc(phone)+'<br><a class="button button-dark" target="_blank" rel="noopener" href="https://wa.me/'+clean(phone)+'?text='+encodeURIComponent(personalized)+'">فتح WhatsApp للجهة دي</a></div>'}).join('')||'<p>مفيش أرقام مسجلة للجمهور ده.</p>'};await load()})();
</script></body></html>
