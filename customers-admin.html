<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK — العملاء</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f2}.admin{max-width:1180px;margin:auto;padding:24px}.admin-head,.admin-actions,.customer-head{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.admin-card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:18px;margin:14px 0}.admin input,.admin select{padding:13px;border:1px solid #ccc;border-radius:12px;width:100%}.searchbox{display:grid;grid-template-columns:1fr auto;gap:10px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stats div{background:#111;color:#fff;padding:16px;border-radius:16px}.rows{display:grid;gap:8px}.row{padding:12px;border:0;border-bottom:1px solid #eee;background:#fff;display:flex;justify-content:space-between;gap:10px;width:100%;text-align:right}.wallet-form{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.wallet-form,.searchbox{grid-template-columns:1fr}}</style></head><body><main class="admin"><div class="admin-head"><div><p class="eyebrow">BLNK ADMIN</p><h1>العملاء والرصيد</h1></div><div><a class="button button-dark" href="operations.html">Operations</a> <a class="button button-light" href="orders-admin.html">الطلبات</a> <a class="button button-light" href="balance-admin.html">شحن الرصيد</a> <a class="button button-light" href="admin.html">المنتجات</a> <a class="button button-light" href="/">المتجر</a></div></div><section id="login" class="admin-card"><h2>دخول الإدارة</h2><form id="loginForm"><input name="email" type="email" value="blnk@admin.com" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="button button-dark">دخول</button><p id="msg"></p></form></section><section id="panel" hidden><div class="admin-card admin-actions"><div><b id="adminName">BLNK Admin</b></div><button id="logout" class="button button-light">خروج</button></div><div class="admin-card"><h2>بحث عن عميل</h2><div class="searchbox"><input id="q" placeholder="رقم الموبايل / Customer ID / الاسم"><button id="search" class="button button-dark">بحث</button></div><div id="results" class="rows"></div></div><div id="customer"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
