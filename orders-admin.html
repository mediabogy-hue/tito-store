<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Order Operations</title><link rel="stylesheet" href="styles.css"><style>
body{background:#f4f4f2}.wrap{max-width:1180px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px;margin:12px 0}.head,.order-head{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111;color:#fff;border-radius:14px;padding:14px}.tag{display:inline-block;border:1px solid #bbb;border-radius:99px;padding:3px 8px;font-size:12px}.muted{opacity:.65}.details{margin-top:12px;padding-top:12px;border-top:1px solid #eee}.item{padding:10px 0;border-bottom:1px solid #eee}.supplier{background:#f6f6f3;padding:10px;border-radius:12px;margin:7px 0}.refund{background:#fff4e5;padding:10px;border-radius:12px;margin:7px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.order select,.card input{padding:10px;border:1px solid #ccc;border-radius:10px}@media(max-width:750px){.grid{grid-template-columns:1fr 1fr}.wrap{padding:10px}}
</style></head><body><main class="wrap"><div class="head"><div><p class="eyebrow">BLNK ADMIN</p><h1>Order Operations</h1><p>العميل · المنتجات · الموردين · الشحن · الاسترجاعات</p></div><a class="button button-light" href="admin.html">الإدارة</a></div>
<section id="login" class="card"><input id="email" type="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section>
<section id="panel" hidden><div id="stats" class="grid"></div><div id="orders"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{let cfg={};try{cfg=await fetch('/api/public-config').then(r=>r.json())}catch(e){};const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),q=s=>document.querySelector(s),money=n=>'EGP '+Number(n||0).toLocaleString(),labels={preparing:'جاري التجهيز',ready_to_ship:'جاهز للشحن',shipped:'تم الشحن',out_for_delivery:'خرج للتسليم',delivered:'تم التسليم',cancelled:'ملغي'};
async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const r=await sb.rpc('admin_orders');if(r.error){q('#orders').textContent=r.error.message;return}const os=r.data||[];q('#stats').innerHTML=[['كل الطلبات',os.length],['جاري التنفيذ',os.filter(x=>!['delivered','cancelled'].includes(x.status)).length],['تم التسليم',os.filter(x=>x.status==='delivered').length],['Refunds',money(os.reduce((a,x)=>a+Number(x.refund_total||0),0))]].map(x=>'<div class="stat"><small>'+x[0]+'</small><h3>'+x[1]+'</h3></div>').join('');
q('#orders').innerHTML=os.map(o=>'<article class="card"><div class="order-head"><div><b>#'+o.order_number+'</b> <span class="tag">'+labels[o.status]+'</span><div>'+(o.customer_name||'')+' · '+(o.phone||'')+'</div><small class="muted">'+(o.customer_code||'')+' · '+money(o.total)+' · '+new Date(o.created_at).toLocaleString('ar-EG')+'</small></div><div class="actions"><button class="button button-light" data-detail="'+o.id+'">فتح التفاصيل</button><select data-order="'+o.id+'">'+Object.entries(labels).map(([v,l])=>'<option value="'+v+'" '+(v===o.status?'selected':'')+'>'+l+'</option>').join('')+'</select></div></div><div><small>موردين '+o.supplier_count+' · انتظار '+o.pending_suppliers+' · مؤكد '+o.confirmed_suppliers+' · ملغي '+o.cancelled_suppliers+(Number(o.refund_total)>0?' · Refund '+money(o.refund_total):'')+'</small></div><div class="details" id="detail-'+o.id+'" hidden></div></article>').join('')||'<div class="card">لا توجد طلبات.</div>';
document.querySelectorAll('[data-order]').forEach(x=>x.onchange=async()=>{if(x.value==='cancelled'&&!confirm('إلغاء الطلب سيعيد المبلغ المستحق للعميل ويرجع المخزون. تأكيد؟')){load();return}const r=await sb.rpc('admin_set_order_status',{p_order_id:x.dataset.order,p_status:x.value});if(r.error)alert(r.error.message);else load()});
document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>detail(b.dataset.detail))}
async function detail(id){const box=q('#detail-'+id);if(!box.hidden){box.hidden=true;return}box.hidden=false;box.innerHTML='جاري التحميل...';const r=await sb.rpc('admin_order_detail',{p_order_id:id});if(r.error){box.textContent=r.error.message;return}const d=r.data,c=d.customer||{},items=d.items||[],ss=d.suppliers||[],refs=d.refunds||[];box.innerHTML='<h3>العميل</h3><div>'+(c.name||'')+' · '+(c.phone||'')+(c.whatsapp?' · WhatsApp '+c.whatsapp:'')+'<br>'+(c.address||'')+' '+(c.city||'')+'</div><h3>المنتجات</h3>'+items.map(x=>'<div class="item"><b>'+x.name+'</b> × '+x.qty+' · '+money(x.unit_price)+'<br>مقاس '+(x.size||'-')+' · لون '+(x.color||'-')+'</div>').join('')+'<h3>Bosta / الشحن</h3><div id="ship-'+id+'"><button class="button button-dark" onclick="prepareShipments(\''+id+'\')">تجهيز شحنات Bosta</button></div><h3>الموردين</h3>'+(ss.length?ss.map(x=>'<div class="supplier"><b>'+x.supplier+'</b> · '+x.product+' × '+x.qty+' <span class="tag">'+x.status+'</span><br>مستحق '+money(x.supplier_amount)+' · هامش BLNK '+money(x.margin)+'</div>').join(''):'<div class="muted">منتجات BLNK مباشرة — لا يوجد مورد خارجي.</div>')+(refs.length?'<h3>Refunds</h3>'+refs.map(x=>'<div class="refund"><b>'+money(x.amount)+'</b> · '+(x.description||'Refund')+'<br><small>'+new Date(x.created_at).toLocaleString('ar-EG')+'</small></div>').join(''):'')}
window.prepareShipments=async function(id){const r=await sb.rpc('admin_prepare_shipments',{p_order_id:id});if(r.error){alert(r.error.message);return}await showShipments(id)}
async function showShipments(id){const box=q('#ship-'+id);if(!box)return;const r=await sb.rpc('admin_order_shipments',{p_order_id:id});if(r.error){box.textContent=r.error.message;return}box.innerHTML='<button class="button button-dark" onclick="prepareShipments(\''+id+'\')">تجهيز/تحديث الشحنات</button>'+((r.data||[]).map(x=>'<div class="supplier"><b>Bosta</b> · '+(x.supplier_name||'BLNK')+' <span class="tag">'+x.status+'</span><br>Tracking: '+(x.tracking_number||'لم يسجل')+' · '+money(x.shipping_fee)+'<div class="actions"><button onclick="setTracking(\''+id+'\',\''+x.id+'\')">تسجيل Tracking</button>'+(x.tracking_url?'<a class="button button-light" target="_blank" href="'+x.tracking_url+'">تتبع</a>':'')+'</div></div>').join('')||'<div class="muted">المورد لم يؤكد الطلب بعد.</div>')}
window.setTracking=async function(orderId,shipmentId){const tracking=prompt('Bosta Tracking Number');if(!tracking)return;const fee=Number(prompt('تكلفة الشحن','0')||0);const r=await sb.rpc('admin_set_shipment_tracking',{p_shipment_id:shipmentId,p_tracking_number:tracking,p_tracking_url:'',p_provider_delivery_id:'',p_bosta_business_location_id:'',p_shipping_fee:fee});if(r.error)alert(r.error.message);else showShipments(orderId)}
q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};load();setInterval(load,30000)})();
</script></body></html>
