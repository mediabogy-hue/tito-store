<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Orders</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f2}.wrap{max-width:1100px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #ddd;border-radius:18px;padding:16px;margin:12px 0}.head,.order{display:flex;gap:12px;justify-content:space-between;align-items:center;flex-wrap:wrap}.order select,.card input{padding:10px;border:1px solid #ccc;border-radius:10px}.muted{opacity:.65}</style></head><body><main class="wrap"><div class="head"><div><p class="eyebrow">BLNK ADMIN</p><h1>طلبات التطبيق</h1></div><a class="button button-light" href="admin.html">الإدارة</a></div><section id="login" class="card"><input id="email" type="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section><section id="panel" hidden><div id="orders"></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{let cfg={};try{cfg=await fetch('/api/public-config').then(r=>r.json())}catch(e){};const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),q=s=>document.querySelector(s),labels={preparing:'جاري التجهيز',ready_to_ship:'جاهز للشحن',shipped:'تم الشحن',out_for_delivery:'خرج للتسليم',delivered:'تم التسليم',cancelled:'ملغي'};async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return; q('#login').hidden=true;q('#panel').hidden=false;const r=await sb.rpc('admin_orders');if(r.error){q('#orders').textContent=r.error.message;return}q('#orders').innerHTML=(r.data||[]).map(o=>'<article class="card order"><div><b>#'+o.order_number+'</b><div>'+(o.customer_name||'')+' · '+(o.phone||'')+'</div><small class="muted">'+(o.customer_code||'')+' · EGP '+Number(o.total).toLocaleString()+'</small></div><select data-order="'+o.id+'">'+Object.entries(labels).map(([v,l])=>'<option value="'+v+'" '+(v===o.status?'selected':'')+'>'+l+'</option>').join('')+'</select></article>').join('')||'<div class="card">لا توجد طلبات.</div>';document.querySelectorAll('[data-order]').forEach(x=>x.onchange=async()=>{const r=await sb.rpc('admin_set_order_status',{p_order_id:x.dataset.order,p_status:x.value});if(r.error)alert(r.error.message);else load()})}q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};load();setInterval(load,30000)})();</script></body></html>
