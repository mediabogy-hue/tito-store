<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK POS</title><link rel="stylesheet" href="styles.css"><style>body{background:#ededeb}.pos{max-width:1380px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid{display:grid;grid-template-columns:1.45fr .8fr;gap:16px}.card{background:#fff;border:1px solid #d5d5d1;padding:18px;margin-top:16px}.search{display:grid;grid-template-columns:1fr auto;gap:8px}.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.item{border:1px solid #ddd;background:#fafafa;padding:12px;cursor:pointer;text-align:right}.item img{width:100%;aspect-ratio:1;object-fit:cover}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.total{display:flex;justify-content:space-between;font-size:24px;font-weight:800;padding:18px 0}.card input,.card select{width:100%;padding:12px;border:1px solid #bbb;background:#fff;font:inherit}.login{max-width:460px;margin:10vh auto;background:#fff;padding:26px}.login form{display:grid;gap:10px}.customer{padding:12px;background:#f2f2ef;margin-top:10px}@media(max-width:850px){.grid{grid-template-columns:1fr}.items{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="pos"><section id="login" class="login"><h1>BLNK POS</h1><form id="loginForm"><input name="email" type="email" value="blnk@admin.com" required><input name="password" type="password" placeholder="كلمة المرور" required><button class="button button-dark">دخول</button><p id="msg"></p></form></section><section id="app" hidden><div class="head"><div><p class="eyebrow">BLNK / POINT OF SALE</p><h1>POS</h1></div><div><a class="button button-light" href="admin.html">الإدارة</a> <a class="button button-light" href="sales-dashboard.html">التقارير</a> <button id="logout" class="button button-light">خروج</button></div></div><div class="grid"><div class="card"><h2>المنتجات</h2><input id="productSearch" placeholder="ابحث باسم المنتج"><div id="products" class="items"></div></div><aside><div class="card"><h2>العميل</h2><div class="search"><input id="customerQ" placeholder="الموبايل / Customer ID / الاسم"><button id="customerSearch" class="button button-dark">بحث</button></div><div id="customer"></div></div><div class="card"><h2>الفاتورة</h2><div id="cart"></div><label>الخصم<input id="discount" type="number" min="0" value="0"></label><label>الدفع<select id="payment"><option value="cash">Cash</option><option value="card">Card</option><option value="wallet">BLNK Balance</option></select></label><div class="total"><span>الإجمالي</span><span id="total">EGP 0</span></div><button id="checkout" class="button button-dark" style="width:100%">إتمام البيع</button><p id="status"></p></div></aside></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="pos.js"></script></body></html>
