<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Customer</title><link rel="stylesheet" href="styles.css"><style>body{background:#efefed}.wrap{max-width:620px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #ddd;border-radius:22px;padding:22px}.code{letter-spacing:2px;font-weight:900}.row{padding:12px 0;border-bottom:1px solid #eee}.row b{display:block;font-size:12px;opacity:.55;margin-bottom:4px}</style></head><body><main class="wrap"><div class="card"><p class="eyebrow">BLNK / CUSTOMER ID</p><h1 id="name">جاري تحميل بيانات العميل...</h1><p class="code" id="code"></p><div id="data"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const code=new URLSearchParams(location.search).get('code');if(!code)return document.querySelector('#name').textContent='QR غير صحيح';const sb=supabase.createClient('https://pdgbifhdskgosxgejwvk.supabase.co','sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c');const r=await sb.rpc('customer_public_card',{p_code:code});if(r.error||!r.data)return document.querySelector('#name').textContent='بيانات العميل غير متاحة';const x=r.data,sp=x.style_profile||{};document.querySelector('#name').textContent=x.full_name||'BLNK Customer';document.querySelector('#code').textContent=x.customer_code||'';const rows=[['الموبايل',x.phone],['واتساب',x.whatsapp],['المدينة',x.city],['العنوان',x.address],['المستوى',x.club_tier],['المقاس',sp.size],['التلبيس',sp.fit],['الستايل',sp.style],['مقاس الجزمة',sp.shoe_size]];document.querySelector('#data').innerHTML=rows.map(v=>'<div class="row"><b>'+v[0]+'</b><span>'+(v[1]||'—')+'</span></div>').join('')})();</script></body></html>
