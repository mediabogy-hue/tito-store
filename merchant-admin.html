<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Merchant Admin</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin-theme.css"><style>body{background:#f4f4f1}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:white;border-radius:16px;padding:18px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select{padding:11px;border:1px solid #ccc;border-radius:9px;font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111;color:#fff;padding:14px;border-radius:12px}.row{padding:12px 0;border-bottom:1px solid #eee}.hidden{display:none}@media(max-width:650px){.grid,.stats{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="card" style="background:#111;color:white"><small>BLNK ADMIN</small><h1>إدارة حسابات التجار</h1><p>مبيعات التجار · عمولة 2.5% · كشوف أسبوعية · مراجعة السداد</p></header><section id="login" class="card"><form id="loginForm" class="grid"><input name="email" type="email" placeholder="البريد الإلكتروني" required><input name="password" type="password" placeholder="كلمة المرور" required><button>دخول الإدارة</button></form><p id="msg"></p></section><section id="panel" class="hidden"><div id="stats" class="stats"></div><div class="card"><h2>إصدار كشف أسبوعي</h2><form id="period" class="grid"><label>من <input name="start" type="date" required></label><label>إلى (غير شامل) <input name="end" type="date" required></label><label>مهلة السداد بالأيام <input name="days" type="number" min="0" value="7"></label><button>إصدار الكشوف</button></form><p id="periodMsg"></p></div><div class="card"><h2>التجار</h2><div id="merchants"></div></div><div class="card"><h2>مدفوعات بانتظار المراجعة</h2><div id="payments"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="merchant-admin.js"></script></body></html>
