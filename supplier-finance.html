<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Supplier Finance</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f1}.wrap{max-width:1100px;margin:auto;padding:20px}.hero{background:#111;color:#fff;padding:24px;border-radius:22px}.card{background:#fff;padding:18px;border-radius:18px;margin-top:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#111;color:#fff;padding:14px;border-radius:14px}.row{padding:12px 0;border-bottom:1px solid #ddd}.tag{border:1px solid #bbb;border-radius:20px;padding:3px 8px}.actions{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style><link rel="stylesheet" href="admin-theme.css?v=20260928-2"></head><body><nav class="blnk-adminbar"><span class="brand">BLNK</span><a href="operations.html">الرئيسية</a><a href="orders-admin.html">الطلبات</a><a href="orders-admin.html#shipping">الشحن</a><a href="suppliers-admin.html">الموردين</a><a href="customers-admin.html">العملاء</a><a href="admin.html">المنتجات</a><a href="balance-admin.html">الرصيد</a><a href="supplier-finance.html">مالية الموردين</a><a href="sales-dashboard.html">التقارير</a><a href="offers-admin.html">التسويق</a><a href="pos.html">POS</a></nav><main class="wrap"><div class="hero"><p>BLNK ADMIN</p><h1>Supplier Finance</h1><p>طلبات الموردين · المستحقات · هامش BLNK</p></div><section id="login" class="card"><input id="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go">دخول</button><p id="msg"></p></section><section id="panel" hidden><div id="stats" class="stats"></div><div class="card"><h2>الموردين</h2><div id="finance"></div></div><div class="card"><h2>طلبات الموردين</h2><div id="orders"></div></div><div class="card"><h2>سجل التسويات</h2><div id="settlements"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=supabase.createClient('https://pdgbifhdskgosxgejwvk.supabase.co','sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'),q=s=>document.querySelector(s),m=n=>'EGP '+Number(n||0).toLocaleString();async function load(){const ss=(await sb.auth.getSession()).data.session;if(!ss)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const [f,o,st]=await Promise.all([sb.rpc('admin_supplier_finance'),sb.rpc('admin_supplier_order_items'),sb.rpc('admin_supplier_settlements')]);if(f.error){q('#finance').textContent=f.error.message;return}const fs=f.data||[],os=o.data||[],due=fs.reduce((a,x)=>a+Number(x.supplier_due||0),0),pending=fs.reduce((a,x)=>a+Number(x.pending||0),0),margin=fs.reduce((a,x)=>a+Number(x.blnk_margin||0),0),units=fs.reduce((a,x)=>a+Number(x.units||0),0);q('#stats').innerHTML=[['مستحقات الموردين',m(due)],['معلق',m(pending)],['هامش BLNK',m(margin)],['القطع',units]].map(x=>'<div class="stat"><small>'+x[0]+'</small><h3>'+x[1]+'</h3></div>').join('');q('#finance').innerHTML=fs.map(x=>'<div class="row"><b>'+x.business_name+'</b><br>إجمالي '+m(x.supplier_due)+' · معلق '+m(x.pending)+' · <b>جاهز للدفع '+m(x.payable)+'</b> · مدفوع '+m(x.paid)+' · هامش BLNK '+m(x.blnk_margin)+(Number(x.payable)>0?'<div class="actions"><button onclick="paySupplier(\''+x.supplier_id+'\')">دفع المستحقات الجاهزة</button></div>':'')+'</div>').join('')||'لا توجد حركة.';q('#orders').innerHTML=os.map(x=>'<div class="row"><b>#'+(x.order_number||'—')+'</b> · '+x.business_name+' · '+x.product_name+' × '+x.quantity+' <span class="tag">'+x.status+'</span><br>مستحق المورد '+m(x.supplier_amount)+' · هامش BLNK '+m(x.blnk_margin)+'<div class="actions">'+(x.status==='payable'?'<b>جاهز للتسوية</b>':'')+'</div></div>').join('')||'لا توجد طلبات موردين.'}window.setStatus=async(id,status)=>{await sb.rpc('admin_set_supplier_order_status',{p_id:id,p_status:status});load()};q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};load()})();</script></body></html>
