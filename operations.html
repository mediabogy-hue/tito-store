<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Operations</title><link rel="stylesheet" href="styles.css"><style>body{background:#f5f5f2;color:#111}.wrap{max-width:1280px;margin:auto;padding:24px}.top{background:#0b0b0b;color:#fff;padding:24px;border-radius:24px}.top h1{font-size:clamp(32px,6vw,64px);margin:5px 0}.eyebrow{opacity:.65;letter-spacing:3px}.top,.nav{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.card{background:#fff;border:1px solid #e1e1dd;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 8px 30px rgba(0,0,0,.035)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#111;color:#fff;border-radius:18px;padding:18px}.stat span{display:block;opacity:.7}.stat strong{font-size:28px}.nav{margin:18px 0}.nav a{flex:1;min-width:150px;text-align:center;border-radius:14px}.stats{margin-top:16px}.stat{min-height:110px;display:flex;flex-direction:column;justify-content:space-between}.pending{border-right:5px solid #111}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><main class="wrap"><div class="top"><div><p class="eyebrow">BLNK ADMIN</p><h1>Operations Center</h1></div><a class="button button-light" href="/">المتجر</a></div><section id="login" class="card"><h2>دخول الإدارة</h2><input id="email" type="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section><section id="panel" hidden><div class="nav"><a class="button button-dark" href="orders-admin.html">طلبات التطبيق</a><a class="button button-light" href="balance-admin.html">طلبات شحن الرصيد</a><a class="button button-light" href="customers-admin.html">العملاء</a><a class="button button-light" href="pos.html">POS</a><a class="button button-light" href="admin.html">المنتجات</a><a class="button button-light" href="sales-dashboard.html">المبيعات</a><a class="button button-light" href="offers-admin.html">أداة العروض</a></div><div id="stats" class="stats"></div><div class="card"><h2>طلبات شحن الرصيد المعلقة</h2><div id="topups"></div></div><div class="card"><h2>أحدث طلبات التطبيق</h2><div id="orders"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{let cfg={};try{cfg=await fetch('/api/public-config').then(r=>r.ok?r.json():Promise.reject())}catch(e){};if(!cfg.supabaseUrl)cfg={supabaseUrl:'https://pdgbifhdskgosxgejwvk.supabase.co',supabasePublishableKey:'sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'};const sb=supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey),q=s=>document.querySelector(s),labels={preparing:'جاري التجهيز',ready_to_ship:'جاهز للشحن',shipped:'تم الشحن',out_for_delivery:'خرج للتسليم',delivered:'تم التسليم',cancelled:'ملغي'};async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const [v,t,o]=await Promise.all([sb.rpc('admin_operations_overview'),sb.rpc('admin_topup_requests'),sb.rpc('admin_orders')]);if(v.error){q('#stats').innerHTML='<div class="card">شغّل ملف admin-operations.sql أولاً.</div>';return}const x=v.data;q('#stats').innerHTML=[['طلبات مفتوحة',x.open_orders],['جاري التجهيز',x.preparing_orders],['جاهز للشحن',x.ready_orders],['شحن رصيد معلق',x.pending_topups],['طلبات اليوم',x.orders_today],['مبيعات التطبيق اليوم','EGP '+Number(x.sales_today).toLocaleString()]].map(z=>'<div class="stat"><span>'+z[0]+'</span><strong>'+z[1]+'</strong></div>').join('');q('#topups').innerHTML=(t.data||[]).filter(x=>x.status==='pending').slice(0,8).map(x=>'<p class="pending"><b>'+x.customer_name+'</b> — EGP '+Number(x.amount).toLocaleString()+' — '+x.method+' — '+x.transaction_reference+'</p>').join('')||'<p>لا توجد طلبات معلقة.</p>';q('#orders').innerHTML=(o.data||[]).slice(0,10).map(x=>'<p><b>#'+x.order_number+'</b> — '+x.customer_name+' — EGP '+Number(x.total).toLocaleString()+' — '+(labels[x.status]||x.status)+'</p>').join('')||'<p>لا توجد طلبات.</p>'}q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};load();setInterval(load,30000)})();</script></body></html>
