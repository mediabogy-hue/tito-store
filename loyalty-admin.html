<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK — مواسم النقاط</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="admin-theme.css?v=20260928-2"><style>body{background:#f5f5f2}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:white;border:1px solid #ddd;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.grid input{padding:12px;border:1px solid #ccc;border-radius:10px}.season{border-top:1px solid #ddd;padding:16px 0;display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.muted{color:#666}.pill{border-radius:99px;background:#eee;padding:5px 12px}.active{background:#d9f5de}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body><nav class="blnk-adminbar"><span class="brand">BLNK</span><a href="operations.html">الرئيسية</a><a href="orders-admin.html">الطلبات</a><a href="customers-admin.html">العملاء</a><a href="loyalty-admin.html">مواسم النقاط</a><a href="balance-admin.html">الرصيد</a></nav><main class="wrap"><header><p class="eyebrow">BLNK REWARDS</p><h1>مواسم النقاط ورصيد الشراء</h1><p>كل ١٠٠ جنيه من مشتريات التجزئة المؤهلة = نقطة واحدة. عند إغلاق الموسم تتحول النقاط المكتسبة فيه إلى رصيد BLNK للشراء بقيمة جنيه لكل نقطة.</p></header><section id="login" class="card"><h2>دخول الإدارة</h2><input id="email" type="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section><section id="panel" hidden><div class="card"><h2>إنشاء موسم</h2><form id="create" class="grid"><input name="name" placeholder="اسم الموسم" required><label>يبدأ في <input name="start" type="date" required></label><label>ينتهي في <input name="end" type="date" required></label><button class="button button-dark">حفظ الموسم</button></form><p id="formMsg" class="muted"></p></div><div class="card"><h2>المواسم</h2><div id="seasons">جاري التحميل…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const c=await fetch('/api/public-config').then(r=>r.json()),sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey),$=s=>document.querySelector(s),money=n=>'EGP '+Number(n||0).toLocaleString('en-US'),status={draft:'مسودة',active:'مفتوح',closed:'مغلق'};async function load(){const a=await sb.rpc('is_admin');if(!a.data){$('#msg').textContent='الحساب ليس لديه صلاحية إدارة.';return}$('#login').hidden=true;$('#panel').hidden=false;const r=await sb.rpc('admin_loyalty_seasons');if(r.error){$('#seasons').textContent='تعذر تحميل المواسم: '+r.error.message;return}const rows=r.data||[];$('#seasons').innerHTML=rows.length?rows.map(s=>`<article class="season"><div><b>${s.name}</b> <span class="pill ${s.status==='active'?'active':''}">${status[s.status]||s.status}</span><p class="muted">${s.starts_on} → ${s.ends_on}</p><small>${Number(s.points||0).toLocaleString()} نقطة · ${Number(s.customers||0)} عميل · رصيد متوقع ${money(s.credit)}</small></div><div>${s.status==='draft'?`<button class="button button-dark" data-start="${s.id}">بدء الموسم</button>`:''}${s.status==='active'&&new Date().toISOString().slice(0,10)>s.ends_on?`<button class="button button-dark" data-close="${s.id}">إغلاق وتحويل الرصيد</button>`:''}</div></article>`).join(''):'لا توجد مواسم بعد.';document.querySelectorAll('[data-start]').forEach(b=>b.onclick=async()=>{if(!confirm('بدء الموسم الآن؟'))return;const x=await sb.rpc('admin_activate_loyalty_season',{p_season_id:b.dataset.start});$('#formMsg').textContent=x.error?'تعذر البدء: '+x.error.message:'تم بدء الموسم.';load()});document.querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{if(!confirm('سيتم تحويل نقاط الموسم إلى رصيد شراء للعملاء. هل تريد المتابعة؟'))return;const x=await sb.rpc('admin_close_loyalty_season',{p_season_id:b.dataset.close});$('#formMsg').textContent=x.error?'تعذر الإغلاق: '+x.error.message:`تم التحويل إلى ${x.data?.settled_customers||0} عميل.`;load()})}$('#go').onclick=async()=>{const x=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#pass').value});if(x.error)$('#msg').textContent='بيانات الدخول غير صحيحة.';else load()};$('#create').onsubmit=async e=>{e.preventDefault();const d=new FormData(e.currentTarget),x=await sb.rpc('admin_create_loyalty_season',{p_name:d.get('name'),p_start:d.get('start'),p_end:d.get('end')});$('#formMsg').textContent=x.error?'تعذر حفظ الموسم: '+x.error.message:'تم حفظ الموسم كمسودة. ابدأه في تاريخ بدايته.';if(!x.error){e.currentTarget.reset();load()}};const s=await sb.auth.getSession();if(s.data.session)load()})();</script></body></html>
