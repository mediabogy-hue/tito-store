<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Supplier Center</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f1}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{background:#0b0b0b;color:#fff;border-radius:24px;padding:26px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:12px}.row{padding:14px 0;border-bottom:1px solid #eee}.tag{padding:4px 9px;border:1px solid #ccc;border-radius:99px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="hero"><p>BLNK ADMIN</p><h1>Supplier Center</h1><p>الموردين · المنتجات · الأسعار · المخزون</p></div><section id="login" class="card"><h2>دخول الإدارة</h2><input id="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section><section id="panel" hidden><div class="card"><h2>إضافة مورد</h2><div class="grid"><input id="business" placeholder="اسم المورد / النشاط"><input id="contact" placeholder="اسم المسؤول"><input id="phone" placeholder="الموبايل"><input id="wa" placeholder="WhatsApp"><input id="category" placeholder="نوع المنتجات"><input id="address" placeholder="العنوان"></div><button id="addSupplier" class="button button-dark">إضافة المورد</button></div><div class="card"><h2>الموردين</h2><div id="suppliers"></div></div><div class="card"><h2>إضافة منتج مورد</h2><div class="grid"><select id="supplier"></select><input id="product" placeholder="اسم المنتج"><input id="cost" type="number" placeholder="سعر المورد"><input id="sell" type="number" placeholder="سعر البيع"><input id="stock" type="number" placeholder="المخزون"></div><button id="addProduct" class="button button-dark">إضافة المنتج للمراجعة</button></div><div class="card"><h2>منتجات الموردين</h2><div id="products"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=supabase.createClient('https://pdgbifhdskgosxgejwvk.supabase.co','sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'),q=s=>document.querySelector(s);async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const [rs,rp]=await Promise.all([sb.rpc('admin_suppliers'),sb.rpc('admin_supplier_products')]);if(rs.error){q('#suppliers').innerHTML='<b>شغّل supabase/suppliers.sql أولاً.</b>';return}const ss=rs.data||[];q('#supplier').innerHTML=ss.filter(x=>x.status==='approved').map(x=>'<option value="'+x.id+'">'+x.business_name+'</option>').join('');q('#suppliers').innerHTML=ss.map(x=>'<div class="row"><b>'+x.business_name+'</b> · '+x.contact_name+' · '+x.phone+' <span class="tag">'+x.status+'</span><div class="actions"><button onclick="supplierStatus(\''+x.id+'\',\'approved\')">اعتماد</button><button onclick="supplierStatus(\''+x.id+'\',\'suspended\')">إيقاف</button></div></div>').join('')||'لا يوجد موردون.';q('#products').innerHTML=(rp.data||[]).map(x=>'<div class="row"><b>'+x.name+'</b> — '+x.supplier_name+'<br>توريد EGP '+x.supplier_price+' · بيع EGP '+(x.selling_price||0)+' · هامش EGP '+((x.selling_price||0)-x.supplier_price)+' · مخزون '+x.stock+' <span class="tag">'+x.status+'</span><div class="actions"><button onclick="productStatus(\''+x.id+'\',\'approved\')">اعتماد</button><button onclick="productStatus(\''+x.id+'\',\'rejected\')">رفض</button></div></div>').join('')||'لا توجد منتجات.'}window.supplierStatus=async(id,status)=>{await sb.rpc('admin_set_supplier_status',{p_id:id,p_status:status});load()};window.productStatus=async(id,status)=>{await sb.rpc('admin_set_supplier_product_status',{p_id:id,p_status:status});load()};q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};q('#addSupplier').onclick=async()=>{const r=await sb.rpc('admin_create_supplier',{p_business_name:q('#business').value,p_contact_name:q('#contact').value,p_phone:q('#phone').value,p_whatsapp:q('#wa').value,p_address:q('#address').value,p_category:q('#category').value});q('#msg').textContent=r.error?r.error.message:'تمت إضافة المورد';if(!r.error)load()};q('#addProduct').onclick=async()=>{const r=await sb.rpc('admin_add_supplier_product',{p_supplier_id:q('#supplier').value,p_name:q('#product').value,p_supplier_price:Number(q('#cost').value),p_selling_price:Number(q('#sell').value),p_stock:Number(q('#stock').value)});q('#msg').textContent=r.error?r.error.message:'تمت إضافة المنتج للمراجعة';if(!r.error)load()};load()})();</script></body></html>
