<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>BLNK Supplier Center</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f1}.wrap{max-width:1100px;margin:auto;padding:22px}.hero{background:#0b0b0b;color:#fff;border-radius:24px;padding:26px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:12px}.row{padding:14px 0;border-bottom:1px solid #eee;overflow:auto}.product-img{width:110px;height:110px;object-fit:cover;border-radius:14px;float:left;margin:0 12px 8px 0}.tag{padding:4px 9px;border:1px solid #ccc;border-radius:99px;font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="admin-theme.css?v=20260928-2"></head><body><nav class="blnk-adminbar"><span class="brand">BLNK</span><a href="operations.html">الرئيسية</a><a href="orders-admin.html">الطلبات</a><a href="orders-admin.html#shipping">الشحن</a><a href="suppliers-admin.html">الموردين</a><a href="customers-admin.html">العملاء</a><a href="admin.html">المنتجات</a><a href="balance-admin.html">الرصيد</a><a href="supplier-finance.html">مالية الموردين</a><a href="sales-dashboard.html">التقارير</a><a href="offers-admin.html">التسويق</a><a href="pos.html">POS</a></nav><main class="wrap"><div class="hero"><p>BLNK ADMIN</p><h1>Supplier Center</h1><p>الموردين · المنتجات · الأسعار · المخزون</p></div><section id="login" class="card"><h2>دخول الإدارة</h2><input id="email" value="blnk@admin.com"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p id="msg"></p></section><section id="panel" hidden><div class="card"><h2>Supplier Workflow</h2><div id="workflow" class="grid"></div></div><div class="card"><h2>إضافة مورد</h2><div class="grid"><input id="business" placeholder="اسم المورد / النشاط"><input id="contact" placeholder="اسم المسؤول"><input id="phone" placeholder="الموبايل"><input id="supplierEmail" type="email" placeholder="Email المورد"><input id="wa" placeholder="WhatsApp"><input id="category" placeholder="نوع المنتجات"><input id="address" placeholder="العنوان"></div><button id="addSupplier" class="button button-dark">إضافة المورد</button></div><div class="card"><h2>الموردين</h2><div id="suppliers"></div></div><div class="card"><h2>منتجات الموردين</h2><div id="products"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=supabase.createClient('https://pdgbifhdskgosxgejwvk.supabase.co','sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'),q=s=>document.querySelector(s);async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;const a=await sb.rpc('is_admin');if(!a.data)return;q('#login').hidden=true;q('#panel').hidden=false;const [rs,rp,rw]=await Promise.all([sb.rpc('admin_suppliers'),sb.rpc('admin_supplier_products'),sb.rpc('admin_supplier_workflow_overview')]);if(rs.error){q('#suppliers').innerHTML='<b>شغّل supabase/suppliers.sql أولاً.</b>';return}const w=rw.data||{};q('#workflow').innerHTML=[['موردين انتظار',w.pending_suppliers||0],['موردين معتمدين',w.approved_suppliers||0],['منتجات انتظار',w.pending_products||0],['منتجات منشورة',w.published_products||0],['طلبات موردين',w.supplier_orders||0],['جاهز للدفع','EGP '+Number(w.payable||0).toLocaleString()],['تم دفعه','EGP '+Number(w.paid||0).toLocaleString()],['هامش BLNK','EGP '+Number(w.blnk_margin||0).toLocaleString()]].map(x=>'<div class="row"><b>'+x[0]+'</b><br>'+x[1]+'</div>').join('');const ss=rs.data||[];q('#supplier').innerHTML=ss.filter(x=>x.status==='approved').map(x=>'<option value="'+x.id+'">'+x.business_name+'</option>').join('');q('#suppliers').innerHTML=ss.map(x=>'<div class="row"><b>'+x.business_name+'</b> · '+x.contact_name+' · '+x.phone+' <span class="tag">'+x.status+'</span><div class="actions"><button onclick="supplierStatus(\''+x.id+'\',\'approved\')">اعتماد</button><button onclick="supplierStatus(\''+x.id+'\',\'suspended\')">إيقاف</button></div></div>').join('')||'لا يوجد موردون.';q('#products').innerHTML=(rp.data||[]).map(x=>'<div class="row">'+(x.image_url?'<img class="product-img" src="'+x.image_url+'" alt="">':'<div class="danger"><b>بدون صورة — لا يمكن نشره</b></div>')+'<b>'+x.name+'</b> — '+x.supplier_name+' <span class="tag">'+x.status+'</span><br>توريد EGP '+x.supplier_price+' · بيع '+(x.selling_price?'EGP '+x.selling_price:'لم يحدد')+' · مخزون '+x.stock+'<br>'+(x.description||'')+'<br>'+(x.sizes?'المقاسات: '+x.sizes+' · ':'')+(x.colors?'الألوان: '+x.colors:'')+'<div class="actions">'+(x.status==='pending'&&x.image_url?'<button onclick="productStatus(\''+x.id+'\',\'approved\')">حدد السعر + وافق + انشر</button>':'')+(x.status==='pending'?'<button onclick="productStatus(\''+x.id+'\',\'rejected\')">رفض</button>':'')+(x.status==='approved'?'<b>✓ منشور في المتجر</b>':'')+'</div></div>').join('')||'لا توجد منتجات.'}window.supplierStatus=async(id,status)=>{await sb.rpc('admin_set_supplier_status',{p_id:id,p_status:status});load()};window.productStatus=async(id,status)=>{if(status==='approved'){const price=prompt('سعر البيع النهائي؟');if(price===null)return;const storeId='supplier-'+id.slice(0,8);const r=await sb.rpc('admin_approve_publish_supplier_product',{p_id:id,p_selling_price:Number(price),p_store_product_id:storeId});q('#msg').textContent=r.error?r.error.message:'تم اعتماد ونشر المنتج في BLNK.';}else{await sb.rpc('admin_set_supplier_product_status',{p_id:id,p_status:status});}load()};window.publishProduct=async(id,storeId)=>{const r=await sb.rpc('admin_publish_supplier_product',{p_supplier_product_id:id,p_store_product_id:storeId});q('#msg').textContent=r.error?r.error.message:'تم نشر منتج المورد في كتالوج BLNK وربط المخزون.';if(!r.error)load()};q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};q('#addSupplier').onclick=async()=>{const r=await sb.rpc('admin_create_supplier_v2',{p_business_name:q('#business').value,p_contact_name:q('#contact').value,p_phone:q('#phone').value,p_email:q('#supplierEmail').value,p_whatsapp:q('#wa').value,p_address:q('#address').value,p_category:q('#category').value});q('#msg').textContent=r.error?r.error.message:'تمت إضافة المورد';if(!r.error)load()};load()})();</script></body></html>
