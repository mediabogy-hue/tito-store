<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Customer Scanner</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;color:#111}.wrap{max-width:760px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:16px}button{padding:13px 18px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;margin:7px 0 12px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f7f7f7;border-radius:12px;padding:14px}.green{color:#087f3e}.red{color:#b42318}.hidden{display:none}video{width:100%;border-radius:12px;background:#000;max-height:360px}.small{color:#666;font-size:13px}</style></head><body><main class="wrap"><div class="card"><h1>BLNK Customer QR Scanner</h1><p class="small">Scan a customer's unique BLNK QR, then view profile, bonus and balance.</p><button id="scan">Start QR Scanner</button> <button id="stop" class="hidden">Stop</button><video id="video" class="hidden" playsinline></video><label>Or enter Customer ID manually</label><input id="id" placeholder="BLNK-000127"><button id="lookup">Find Customer</button><p id="msg"></p></div><section id="customer" class="card hidden"><h2 id="name"></h2><div class="grid"><div class="stat">Customer ID<br><b id="cid"></b></div><div class="stat">Phone<br><b id="phone"></b></div><div class="stat">Balance<br><b id="balance"></b></div><div class="stat">Bonus<br><b id="bonus"></b></div></div><h3>Profile</h3><div id="profile"></div><hr><h3>Adjust Balance / Bonus</h3><select id="type"><option value="bonus_add">Add Bonus</option><option value="bonus_sub">Deduct Bonus</option><option value="balance_add">Add Balance</option><option value="balance_sub">Deduct Balance</option></select><input id="amount" type="number" min="0" step="1" placeholder="Amount (EGP)"><input id="reason" placeholder="Purchase / Bonus / Refund / Adjustment"><button id="save">Save Transaction</button><p id="saveMsg"></p></section></main><script>let current=null,stream=null;const $=id=>document.getElementById(id);function msg(t,c=''){$('msg').textContent=t;$('msg').className=c}async function lookup(id){id=(id||'').trim();if(!id)return msg('Enter a Customer ID');msg('Loading...');try{const r=await fetch('/api/customer?id='+encodeURIComponent(id));if(!r.ok)throw Error('Customer not found');current=await r.json();render();msg('Customer found','green')}catch(e){current=null;$('customer').classList.add('hidden');msg(e.message,'red')}}function render(){const c=current;$('customer').classList.remove('hidden');$('name').textContent=c.name||'BLNK Customer';$('cid').textContent=c.customerId||c.id;$('phone').textContent=c.phone||'-';$('balance').textContent=(Number(c.balance)||0).toFixed(2)+' EGP';$('bonus').textContent=(Number(c.bonus)||0).toFixed(2)+' EGP';const p=c.profile||{};$('profile').innerHTML=Object.entries(p).filter(x=>x[1]!==''&&x[1]!=null).map(x=>'<b>'+x[0]+':</b> '+(Array.isArray(x[1])?x[1].join(', '):String(x[1]))).join('<br>')||'No profile details'}async function start(){if(!('BarcodeDetector'in window))return msg('QR scanner is not supported here. Enter Customer ID manually.','red');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;$('video').classList.remove('hidden');$('scan').classList.add('hidden');$('stop').classList.remove('hidden');await $('video').play();const d=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!stream)return;try{const a=await d.detect($('video'));if(a[0]?.rawValue){$('id').value=a[0].rawValue;stop();lookup(a[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){msg('Camera permission was denied or unavailable.','red')}}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').classList.add('hidden');$('scan').classList.remove('hidden');$('stop').classList.add('hidden')}$('scan').onclick=start;$('stop').onclick=stop;$('lookup').onclick=()=>lookup($('id').value);$('save').onclick=async()=>{if(!current)return;const amount=Number($('amount').value);if(!(amount>0))return $('saveMsg').textContent='Enter a valid amount';try{const r=await fetch('/api/customer/transaction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerId:current.customerId||current.id,type:$('type').value,amount,reason:$('reason').value.trim()||'Adjustment'})});if(!r.ok)throw Error('Save failed');current=await r.json();render();$('saveMsg').textContent='Saved successfully';$('amount').value='';$('reason').value=''}catch(e){$('saveMsg').textContent=e.message}}</script></body></html>
