<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Customer QR Scanner</title><style>body{font-family:Arial,sans-serif;background:#f4f4f4;margin:0;padding:20px;color:#111}.wrap{max-width:800px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px;margin-bottom:16px}button{padding:13px 18px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}input,select{width:100%;box-sizing:border-box;padding:13px;border:1px solid #ccc;border-radius:10px;margin:7px 0 12px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f7f7f7;border-radius:12px;padding:14px}.green{color:#087f3e}.red{color:#b42318}.hidden{display:none}video{width:100%;border-radius:12px;background:#000;max-height:360px}.small{color:#666;font-size:13px}.ledger{border-collapse:collapse;width:100%;margin-top:10px}.ledger th,.ledger td{padding:9px;border-bottom:1px solid #eee;text-align:right;font-size:13px}.add{color:#087f3e}.sub{color:#b42318}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>BLNK Customer QR Scanner</h1><p class="small">امسح QR العميل عشان تشوف ملفه والرصيد والـBonus وتعمل إضافة أو خصم.</p><label>كلمة مرور الإدارة</label><input id="adminKey" type="password" placeholder="ADMIN_KEY"><button id="saveKey">حفظ كلمة المرور</button></div><div class="card"><button id="scan">ابدأ Scan QR</button> <button id="stop" class="hidden">إيقاف</button><video id="video" class="hidden" playsinline></video><label>أو اكتب Customer ID</label><input id="id" placeholder="BLNK-20260917-ABCDE"><button id="lookup">بحث عن العميل</button><p id="msg"></p></div><section id="customer" class="card hidden"><h2 id="name"></h2><div class="grid"><div class="stat">Customer ID<br><b id="cid"></b></div><div class="stat">WhatsApp<br><b id="phone"></b></div><div class="stat">Balance<br><b id="balance"></b></div><div class="stat">Bonus<br><b id="bonus"></b></div></div><h3>بيانات العميل</h3><div id="profile"></div><hr><h3>إضافة / خصم</h3><select id="type"><option value="bonus_add">إضافة Bonus</option><option value="bonus_sub">خصم Bonus</option><option value="balance_add">إضافة رصيد</option><option value="balance_sub">خصم رصيد</option></select><input id="amount" type="number" min="0" step="1" placeholder="القيمة بالجنيه"><input id="reason" placeholder="سبب العملية: Purchase / Bonus / Refund / Adjustment"><button id="save">حفظ العملية</button><p id="saveMsg"></p><h3>سجل العمليات</h3><table class="ledger"><thead><tr><th>التاريخ</th><th>العملية</th><th>القيمة</th><th>السبب</th></tr></thead><tbody id="ledger"></tbody></table></section></main><script>let current=null,stream=null;const $=id=>document.getElementById(id);const key=()=>localStorage.getItem('blnk_admin_key')||'';function msg(t,c=''){$('msg').textContent=t;$('msg').className=c}function ensureKey(){if(!key())return msg('اكتب كلمة مرور الإدارة أولاً','red');return true}async function lookup(id){if(!ensureKey())return;id=(id||'').trim();if(!id)return msg('اكتب Customer ID');msg('جاري البحث...');try{const r=await fetch('/api/customer?id='+encodeURIComponent(id),{headers:{'x-admin-key':key()}});const data=await r.json();if(!r.ok)throw Error(data.error||'Customer not found');current=data;render();msg('تم العثور على العميل','green')}catch(e){current=null;$('customer').classList.add('hidden');msg(e.message,'red')}}function render(){const c=current;$('customer').classList.remove('hidden');$('name').textContent=c.name||'BLNK Customer';$('cid').textContent=c.customerId||'-';$('phone').textContent=c.phone||'-';$('balance').textContent=(Number(c.balance)||0).toFixed(2)+' EGP';$('bonus').textContent=(Number(c.bonus)||0).toFixed(2)+' EGP';const p=c.profile||{};$('profile').innerHTML=Object.entries(p).filter(x=>x[1]!==''&&x[1]!=null).map(x=>'<b>'+x[0]+':</b> '+String(x[1])).join('<br>')||'No profile details';$('ledger').innerHTML=(c.ledger||[]).map(x=>`<tr><td>${new Date(x.createdAt).toLocaleString('ar-EG')}</td><td>${x.type}</td><td class="${String(x.type).includes('_add')?'add':'sub'}">${x.amount} EGP</td><td>${x.reason||''}</td></tr>`).join('')||'<tr><td colspan="4">لا توجد عمليات</td></tr>'}async function start(){if(!ensureKey())return;if(!('BarcodeDetector'in window))return msg('المتصفح لا يدعم Scan QR هنا. استخدم Customer ID.','red');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});$('video').srcObject=stream;$('video').classList.remove('hidden');$('scan').classList.add('hidden');$('stop').classList.remove('hidden');await $('video').play();const d=new BarcodeDetector({formats:['qr_code']});const loop=async()=>{if(!stream)return;try{const a=await d.detect($('video'));if(a[0]?.rawValue){$('id').value=a[0].rawValue;stop();lookup(a[0].rawValue);return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){msg('اسمح للمتصفح باستخدام الكاميرا.','red')}}function stop(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').classList.add('hidden');$('scan').classList.remove('hidden');$('stop').classList.add('hidden')}$('saveKey').onclick=()=>{const v=$('adminKey').value.trim();if(v){localStorage.setItem('blnk_admin_key',v);msg('تم حفظ كلمة مرور الإدارة','green')}};$('adminKey').value=key();$('scan').onclick=start;$('stop').onclick=stop;$('lookup').onclick=()=>lookup($('id').value);$('save').onclick=async()=>{if(!current||!ensureKey())return;const amount=Number($('amount').value);if(!(amount>0))return $('saveMsg').textContent='اكتب قيمة صحيحة';try{const r=await fetch('/api/customer/transaction',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':key()},body:JSON.stringify({customerId:current.customerId,type:$('type').value,amount,reason:$('reason').value.trim()||'Adjustment'})});const data=await r.json();if(!r.ok)throw Error(data.error||'Save failed');current=data;render();$('saveMsg').textContent='تم حفظ العملية';$('amount').value='';$('reason').value=''}catch(e){$('saveMsg').textContent=e.message}}</script></body></html>
