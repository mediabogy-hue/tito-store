<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BLNK Supplier Portal</title><link rel="stylesheet" href="styles.css"><style>body{background:#f4f4f1}.wrap{max-width:950px;margin:auto;padding:20px}.hero{background:#090909;color:#fff;border-radius:25px;padding:25px}.card{background:#fff;border:1px solid #ddd;border-radius:20px;padding:20px;margin-top:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ccc;border-radius:12px}.row{padding:13px 0;border-bottom:1px solid #eee}.tag{border:1px solid #bbb;border-radius:99px;padding:3px 8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="hero"><p>BLNK PARTNERS</p><h1>Supplier Portal</h1><p>منتجاتك · مخزونك · حالة الاعتماد</p></div><section id="login" class="card"><h2>دخول المورد</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="pass" type="password" placeholder="كلمة المرور"><button id="go" class="button button-dark">دخول</button><p>لازم الإدارة تضيف بريدك وتعتمد حساب المورد أولاً.</p><p id="msg"></p></section><section id="panel" hidden><div class="card"><h2 id="name"></h2><p id="info"></p><button id="logout">تسجيل خروج</button></div><div class="card"><h2>إضافة منتج</h2><div class="grid"><input id="product" placeholder="اسم المنتج"><input id="cost" type="number" placeholder="سعر التوريد لـ BLNK"><input id="stock" type="number" placeholder="الكمية المتاحة"><input id="image" type="url" placeholder="رابط صورة المنتج"><input id="sizes" placeholder="المقاسات مثال S,M,L,XL"><input id="colors" placeholder="الألوان مثال Black,White,Beige"><input id="description" placeholder="وصف المنتج"></div><button id="add" class="button button-dark">إرسال المنتج للمراجعة</button><p id="productMsg"></p></div><div class="card"><h2>ملخص المبيعات والمستحقات</h2><div id="finance"></div></div><div class="card"><h2>طلباتي</h2><div id="orders"></div></div><div class="card"><h2>منتجاتي</h2><div id="products"></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const sb=supabase.createClient('https://pdgbifhdskgosxgejwvk.supabase.co','sb_publishable_Hkigj8Wcm0UfBwHAAEnxow_8wyofL2c'),q=s=>document.querySelector(s);async function load(){const s=(await sb.auth.getSession()).data.session;if(!s)return;let c=await sb.rpc('claim_supplier_account');if(c.error){q('#msg').textContent=c.error.message==='SUPPLIER_NOT_APPROVED'?'الحساب غير مربوط بمورد معتمد. تواصل مع إدارة BLNK.':c.error.message;return}const [p,ps,fin,ord]=await Promise.all([sb.rpc('supplier_my_profile'),sb.rpc('supplier_my_products'),sb.rpc('supplier_my_finance'),sb.rpc('supplier_my_orders')]);const x=(p.data||[])[0];if(!x)return;q('#login').hidden=true;q('#panel').hidden=false;q('#name').textContent=x.business_name;q('#info').textContent=x.contact_name+' · '+x.phone+' · '+x.status;const ff=fin.data||{};q('#finance').innerHTML='<div class="grid"><div><b>إجمالي مستحقاتك</b><br>EGP '+Number(ff.total_due||0).toLocaleString()+'</div><div><b>معلق</b><br>EGP '+Number(ff.pending||0).toLocaleString()+'</div><div><b>تم دفعه</b><br>EGP '+Number(ff.paid||0).toLocaleString()+'</div><div><b>القطع</b><br>'+Number(ff.units||0)+'</div></div>';q('#orders').innerHTML=(ord.data||[]).map(z=>'<div class="row"><b>#'+z.order_number+'</b> · '+z.product_name+' × '+z.quantity+' <span class="tag">'+z.status+'</span><br>مستحقك EGP '+Number(z.supplier_amount||0).toLocaleString()+'</div>').join('')||'لا توجد طلبات مورد حتى الآن.';q('#products').innerHTML=(ps.data||[]).map(z=>'<div class="row">'+(z.image_url?'<img src="'+z.image_url+'" style="width:70px;height:70px;object-fit:cover;border-radius:12px;float:left">':'')+'<b>'+z.name+'</b> <span class="tag">'+z.status+'</span><br>سعر التوريد EGP '+z.supplier_price+' · سعر البيع '+(z.selling_price?'EGP '+z.selling_price:'تحدده BLNK')+' · مخزون '+z.stock+'<br>'+(z.sizes?'المقاسات: '+z.sizes+' · ':'')+(z.colors?'الألوان: '+z.colors:'')+'</div>').join('')||'لم تضف منتجات بعد.'}q('#go').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:q('#email').value,password:q('#pass').value});q('#msg').textContent=r.error?'بيانات الدخول غير صحيحة':'';if(!r.error)load()};q('#add').onclick=async()=>{const r=await sb.rpc('supplier_add_product',{p_name:q('#product').value,p_supplier_price:Number(q('#cost').value),p_stock:Number(q('#stock').value),p_description:q('#description').value,p_image_url:q('#image').value,p_sizes:q('#sizes').value,p_colors:q('#colors').value});q('#productMsg').textContent=r.error?r.error.message:'تم إرسال المنتج للإدارة للمراجعة.';if(!r.error)load()};q('#logout').onclick=async()=>{await sb.auth.signOut();location.reload()};load()})();</script></body></html>
