<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="logo.svg" type="image/svg+xml"><title>BLNK — إدارة المنتجات</title><style>:root{font-family:Arial,system-ui,sans-serif;color:#111;background:#f3f3f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logo{font-size:30px;font-weight:900}.muted{color:#666}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.dark{background:#111;color:#fff}.light{background:#eee;color:#111}.danger{background:#eee;color:#b00020}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800}input,select,textarea{width:100%;border:1px solid #ccc;border-radius:10px;padding:12px;font:inherit}textarea{min-height:80px}.products{display:grid;gap:10px}.product{border:1px solid #ddd;border-radius:14px;padding:12px;display:grid;grid-template-columns:75px 1fr auto;gap:12px;align-items:center}.thumb{width:75px;height:90px;background:#eee;border-radius:10px;display:grid;place-items:center;font-weight:900;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.meta{font-size:13px;color:#666;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}.check{display:flex;flex-direction:row;align-items:center;gap:7px}.check input{width:auto}.status{margin-top:10px;font-weight:700}.empty{text-align:center;padding:20px;color:#777}.preview{max-width:100px;max-height:100px;border-radius:10px;margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.product{grid-template-columns:60px 1fr}.thumb{width:60px;height:75px}.product .actions{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="logo">BLNK</div><div class="muted">إدارة وإضافة المنتجات</div></div><div class="toolbar"><a href="index.html" class="button light">المتجر</a><button class="button light" onclick="toggleLang()">EN / AR</button></div></div><div class="panel" id="loginPanel"><h2>دخول الإدارة</h2><p class="muted">على الموقع المباشر استخدم مفتاح الإدارة. داخل تطبيق BLNK يمكنك إدارة المنتجات محليًا بدون مفتاح.</p><div class="toolbar"><input id="adminKey" type="password" placeholder="Admin key"><button class="button dark" onclick="login()">فتح الإدارة</button><button class="button light" onclick="openLocal()">الدخول المحلي</button></div><div id="loginStatus" class="status"></div></div><div id="manager" hidden><div class="panel"><div class="top"><div><h2 style="margin:0">المنتجات</h2><div class="muted">أضف، عدّل، اخفِ أو احذف المنتجات.</div></div><button class="button dark" onclick="newProduct()">+ إضافة منتج</button></div><div id="products" class="products"></div><div id="status" class="status"></div></div><div class="panel" id="editor" hidden><h2 id="editorTitle">إضافة منتج</h2><div class="grid"><div class="field"><label>اسم المنتج</label><input id="name" placeholder="Essential T-Shirt"></div><div class="field"><label>القسم</label><select id="category"><option value="tshirt">T-Shirt</option><option value="shirt">Shirt</option><option value="shorts">Shorts</option><option value="pants">Pants</option><option value="hoodie">Hoodie</option><option value="last">Last Piece</option></select></div><div class="field"><label>السعر بالجنيه</label><input id="price" type="number" min="0"></div><div class="field"><label>السعر القديم</label><input id="oldPrice" type="number" min="0"></div><div class="field"><label>المقاسات</label><input id="sizes" placeholder="M, L, XL"></div><div class="field"><label>الألوان</label><input id="colors" placeholder="Black, White"></div><div class="field"><label>المخزون / القطع</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label>صورة المنتج من الموبايل</label><input id="imageFile" type="file" accept="image/*" onchange="previewImage()"><img id="preview" class="preview" hidden></div><div class="field full"><label>أو رابط الصورة</label><input id="image" placeholder="https://..."></div><div class="field full"><label>وصف قصير</label><textarea id="note"></textarea></div><label class="check"><input id="lastPieces" type="checkbox"> آخر قطع</label><label class="check"><input id="active" type="checkbox" checked> ظاهر في المتجر</label></div><div class="toolbar" style="margin-top:15px"><button class="button dark" onclick="saveProduct()">حفظ المنتج</button><button class="button light" onclick="closeEditor()">إلغاء</button></div></div></div></div><script>let products=[],editingId=null,key='',localMode=false;const $=id=>document.getElementById(id);function localLoad(){try{return JSON.parse(localStorage.getItem('blnk_products_v1')||'null')}catch(e){return null}}function openLocal(){localMode=true;products=localLoad()||windowDefault();$('loginPanel').hidden=true;$('manager').hidden=false;render()}function windowDefault(){return[{id:'blnk-tshirt-001',name:'Essential T-Shirt',category:'tshirt',price:349,image:'',note:'Clean fit / everyday essential',sizes:['M','L','XL','2XL'],colors:['Black','White','Grey'],stock:0,active:true,lastPieces:false},{id:'blnk-shirt-001',name:'Summer Shirt',category:'shirt',price:349,image:'',note:'Lightweight / easy fit',sizes:['M','L','XL','2XL'],colors:['White','Black','Beige'],stock:0,active:true,lastPieces:false},{id:'blnk-shorts-001',name:'Everyday Shorts',category:'shorts',price:299,image:'',note:'Relaxed / everyday',sizes:['M','L','XL','2XL'],colors:['Black','Grey'],stock:0,active:true,lastPieces:false}]}async function login(){key=$('adminKey').value.trim();try{const r=await fetch('/api/products');if(!r.ok)throw 0;products=await r.json();localMode=false;$('loginPanel').hidden=true;$('manager').hidden=false;render()}catch(e){$('loginStatus').textContent='تعذر الاتصال بالخدمة. استخدم الدخول المحلي داخل التطبيق.'}}function render(){const root=$('products');if(!products.length){root.innerHTML='<div class="empty">لا توجد منتجات.</div>';return}root.innerHTML=products.map(p=>`<div class="product"><div class="thumb">${p.image?`<img src="${p.image}" alt="">`:'BLNK'}</div><div><h3 style="margin:0">${esc(p.name)}</h3><div class="meta">EGP ${Number(p.price).toLocaleString()} · ${esc(p.category)} · المخزون ${p.stock??0}</div><div class="meta">${(p.sizes||[]).join(', ')} · ${(p.colors||[]).join(', ')}</div><div class="meta">${p.active?'ظاهر':'مخفي'}${p.lastPieces?' · آخر قطع':''}</div></div><div class="actions"><button class="button light" onclick="editProduct('${p.id}')">تعديل</button><button class="button danger" onclick="removeProduct('${p.id}')">حذف</button></div></div>`).join('')}function newProduct(){editingId=null;$('editorTitle').textContent='إضافة منتج';['name','price','oldPrice','sizes','colors','stock','image','note'].forEach(id=>$(id).value='');$('stock').value=0;$('lastPieces').checked=false;$('active').checked=true;$('preview').hidden=true;$('editor').hidden=false}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('editorTitle').textContent='تعديل المنتج';$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('oldPrice').value=p.oldPrice??'';$('sizes').value=(p.sizes||[]).join(', ');$('colors').value=(p.colors||[]).join(', ');$('stock').value=p.stock??0;$('image').value=p.image||'';$('note').value=p.note||'';$('lastPieces').checked=!!p.lastPieces;$('active').checked=p.active!==false;$('preview').hidden=!p.image;$('preview').src=p.image||'';$('editor').hidden=false}function closeEditor(){$('editor').hidden=true}function previewImage(){const f=$('imageFile').files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=r.result;$('preview').hidden=false};r.readAsDataURL(f)}async function saveProduct(){let image=$('image').value.trim();const f=$('imageFile').files[0];if(f){image=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}const id=editingId||('product-'+Date.now());const p={id,name:$('name').value.trim(),category:$('category').value,price:Number($('price').value||0),oldPrice:$('oldPrice').value?Number($('oldPrice').value):null,sizes:csv($('sizes').value),colors:csv($('colors').value),stock:Number($('stock').value||0),image,note:$('note').value.trim(),lastPieces:$('lastPieces').checked,active:$('active').checked};if(!p.name){$('status').textContent='اكتب اسم المنتج والسعر.';return}const i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=p;else products.push(p);if(localMode){localStorage.setItem('blnk_products_v1',JSON.stringify(products));$('status').textContent='تم الحفظ على التطبيق.';render();closeEditor();return}const r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(products)});const data=await r.json().catch(()=>({}));if(!r.ok){$('status').textContent=data.error||'فشل الحفظ';return}products=data.products;render();$('status').textContent='تم الحفظ.';closeEditor()}async function removeProduct(id){if(!confirm('حذف المنتج؟'))return;products=products.filter(p=>p.id!==id);if(localMode){localStorage.setItem('blnk_products_v1',JSON.stringify(products));render();return}await saveAll()}async function saveAll(){const r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(products)});if(r.ok){products=(await r.json()).products;render()}}function csv(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function toggleLang(){document.documentElement.lang=document.documentElement.lang==='ar'?'en':'ar';document.documentElement.dir=document.documentElement.lang==='ar'?'rtl':'ltr'}</script></body></html>
