<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow" />
  <title>BLNK — Product Manager</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#111;background:#f3f3f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}.logo{font-size:30px;font-weight:900;letter-spacing:-1px}.muted{color:#666}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:20px;margin-bottom:18px}.toolbar{display:flex;gap:10px;flex-wrap:wrap}.button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer}.dark{background:#111;color:#fff}.light{background:#eee;color:#111}.danger{background:#eee;color:#b00020}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:7px}.field.full{grid-column:1/-1}label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}input,select,textarea{width:100%;border:1px solid #d4d4d4;border-radius:10px;padding:12px;font:inherit;background:#fff}textarea{min-height:80px;resize:vertical}.products{display:grid;gap:12px}.product{border:1px solid #ddd;border-radius:14px;padding:15px;display:grid;grid-template-columns:90px 1fr auto;gap:14px;align-items:center}.thumb{width:90px;height:110px;background:#eee;border-radius:10px;display:grid;place-items:center;font-weight:900;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.product h3{margin:0 0 5px}.meta{font-size:13px;color:#666}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{margin-top:12px;font-weight:700}.check{display:flex;flex-direction:row;align-items:center;gap:8px}.check input{width:auto}.empty{padding:25px;text-align:center;color:#777}@media(max-width:700px){.grid{grid-template-columns:1fr}.product{grid-template-columns:65px 1fr}.thumb{width:65px;height:85px}.product .actions{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><div class="logo">BLNK</div><div class="muted">Product Manager</div></div><a href="/" class="button light">View Store</a></div>

  <div class="panel" id="loginPanel">
    <h2>Admin access</h2>
    <p class="muted">Enter the private admin key configured for this store.</p>
    <div class="toolbar"><input id="adminKey" type="password" placeholder="Admin key" style="max-width:360px"><button class="button dark" onclick="login()">Open Manager</button></div>
    <div id="loginStatus" class="status"></div>
  </div>

  <div id="manager" hidden>
    <div class="panel">
      <div class="top" style="margin-bottom:12px"><div><h2 style="margin:0">Products</h2><div class="muted">Add, edit, hide or delete products. Changes publish to the store after saving.</div></div><button class="button dark" onclick="newProduct()">+ Add Product</button></div>
      <div id="products" class="products"></div>
      <div id="status" class="status"></div>
    </div>

    <div class="panel" id="editor" hidden>
      <h2 id="editorTitle">Add Product</h2>
      <div class="grid">
        <div class="field"><label>Name</label><input id="name" placeholder="Essential T-Shirt"></div>
        <div class="field"><label>Category</label><select id="category"><option value="tshirt">T-Shirt</option><option value="shirt">Shirt</option><option value="shorts">Shorts</option><option value="pants">Pants</option><option value="hoodie">Hoodie</option><option value="last">Last Piece</option></select></div>
        <div class="field"><label>Price (EGP)</label><input id="price" type="number" min="0"></div>
        <div class="field"><label>Old Price (optional)</label><input id="oldPrice" type="number" min="0"></div>
        <div class="field"><label>Sizes</label><input id="sizes" placeholder="M, L, XL"></div>
        <div class="field"><label>Colors</label><input id="colors" placeholder="Black, White"></div>
        <div class="field"><label>Stock / Pieces</label><input id="stock" type="number" min="0" value="0"></div>
        <div class="field"><label>Image URL</label><input id="image" placeholder="https://..."></div>
        <div class="field full"><label>Short description</label><textarea id="note" placeholder="Clean fit / everyday essential"></textarea></div>
        <label class="check"><input id="lastPieces" type="checkbox"> Last Pieces</label>
        <label class="check"><input id="active" type="checkbox" checked> Visible on store</label>
      </div>
      <div class="toolbar" style="margin-top:16px"><button class="button dark" onclick="saveProduct()">Save Product</button><button class="button light" onclick="closeEditor()">Cancel</button></div>
    </div>
  </div>
</div>
<script>
let products=[]; let editingId=null; let key='';
const $=id=>document.getElementById(id);
async function login(){key=$('adminKey').value.trim(); if(!key)return; const r=await fetch('/api/products'); if(!r.ok){$('loginStatus').textContent='Could not connect to the product service.';return} products=await r.json(); $('loginPanel').hidden=true; $('manager').hidden=false; render();}
async function load(){const r=await fetch('/api/products'); if(r.ok){products=await r.json();render();}}
function render(){const root=$('products'); if(!products.length){root.innerHTML='<div class="empty">No products yet.</div>';return} root.innerHTML=products.map(p=>`<div class="product"><div class="thumb">${p.image?`<img src="${escapeHtml(p.image)}" alt="">`:'BLNK'}</div><div><h3>${escapeHtml(p.name)}</h3><div class="meta">EGP ${Number(p.price).toLocaleString()} · ${escapeHtml(p.category)} · Stock ${p.stock}</div><div class="meta">${p.sizes?.join(', ')||'No sizes'} · ${p.colors?.join(', ')||'No colors'}</div><div class="meta">${p.active?'Visible':'Hidden'}${p.lastPieces?' · Last Pieces':''}</div></div><div class="actions"><button class="button light" onclick="editProduct('${p.id}')">Edit</button><button class="button danger" onclick="removeProduct('${p.id}')">Delete</button></div></div>`).join('');}
function newProduct(){editingId=null; $('editorTitle').textContent='Add Product'; ['name','price','oldPrice','sizes','colors','stock','image','note'].forEach(id=>$(id).value=''); $('stock').value=0;$('lastPieces').checked=false;$('active').checked=true;$('editor').hidden=false;scrollTo(0,$('editor').offsetTop)}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('editorTitle').textContent='Edit Product';$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('oldPrice').value=p.oldPrice??'';$('sizes').value=(p.sizes||[]).join(', ');$('colors').value=(p.colors||[]).join(', ');$('stock').value=p.stock??0;$('image').value=p.image||'';$('note').value=p.note||'';$('lastPieces').checked=!!p.lastPieces;$('active').checked=p.active!==false;$('editor').hidden=false;scrollTo(0,$('editor').offsetTop)}
function closeEditor(){$('editor').hidden=true}
async function saveProduct(){const id=editingId||('product-'+Date.now());const p={id,name:$('name').value.trim(),category:$('category').value,price:Number($('price').value||0),oldPrice:$('oldPrice').value?Number($('oldPrice').value):null,sizes:csv($('sizes').value),colors:csv($('colors').value),stock:Number($('stock').value||0),image:$('image').value.trim(),note:$('note').value.trim(),lastPieces:$('lastPieces').checked,active:$('active').checked};if(!p.name||p.price<0){$('status').textContent='Add a product name and valid price.';return}const i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=p;else products.push(p);await saveAll();closeEditor()}
async function removeProduct(id){if(!confirm('Delete this product?'))return;products=products.filter(p=>p.id!==id);await saveAll()}
async function saveAll(){ $('status').textContent='Saving…'; const r=await fetch('/api/products',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-key':key},body:JSON.stringify(products)});const data=await r.json().catch(()=>({}));if(!r.ok){$('status').textContent=data.error||'Save failed.';return}products=data.products;render();$('status').textContent='Saved. Store catalog updated.'}
function csv(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script>
</body>
</html>
