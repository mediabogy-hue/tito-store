<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" href="logo.svg"><title>BLNK — إدارة المنتجات</title><style>:root{font-family:Arial,system-ui,sans-serif;color:#111;background:#f3f3f3}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logo{font-size:30px;font-weight:900}.muted{color:#666}.panel{background:#fff;border:1px solid #ddd;border-radius:18px;padding:18px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.button{border:0;border-radius:10px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.dark{background:#111;color:#fff}.light{background:#eee;color:#111}.danger{background:#eee;color:#b00020}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:6px}.full{grid-column:1/-1}label{font-size:12px;font-weight:800}input,select,textarea{width:100%;border:1px solid #ccc;border-radius:10px;padding:12px;font:inherit}textarea{min-height:80px}.products{display:grid;gap:10px}.product{border:1px solid #ddd;border-radius:14px;padding:12px;display:grid;grid-template-columns:75px 1fr auto;gap:12px;align-items:center}.thumb{width:75px;height:90px;background:#eee;border-radius:10px;display:grid;place-items:center;font-weight:900;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.meta{font-size:13px;color:#666;margin-top:3px}.actions{display:flex;gap:6px;flex-wrap:wrap}.check{display:flex;flex-direction:row;align-items:center;gap:7px}.check input{width:auto}.status{margin-top:10px;font-weight:700}.empty{text-align:center;padding:20px;color:#777}.preview{max-width:100px;max-height:100px;border-radius:10px;margin-top:8px}.hint{font-size:13px;line-height:1.6;background:#f7f7f7;border-radius:12px;padding:12px;margin-top:10px}.ok{color:#087f23}.err{color:#b00020}@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.product{grid-template-columns:60px 1fr}.thumb{width:60px;height:75px}.product .actions{grid-column:1/-1}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><div class="logo">BLNK</div><div class="muted">إدارة المنتجات — الموقع + APK</div></div><div class="toolbar"><a href="index.html" class="button light">المتجر</a><a href="customers-admin.html" class="button dark">العملاء والرصيد</a><a href="pos.html" class="button dark">POS</a><a href="admin/scanner.html" class="button dark">📷 Customer QR Scanner</a></div></div><div class="panel" id="loginPanel"><h2>دخول الإدارة</h2><p>استخدم حساب BLNK Admin المصرح به.</p><input id="adminEmail" type="email" value="blnk@admin.com" autocomplete="username" placeholder="إيميل الإدارة"><input id="adminPassword" type="password" autocomplete="current-password" placeholder="كلمة المرور"><div class="toolbar" style="margin-top:10px"><button class="button dark" onclick="adminLogin()">فتح الإدارة</button></div><div id="loginStatus" class="status"></div></div><div id="manager" hidden><div class="panel"><div class="top"><div><h2 style="margin:0">المنتجات</h2><div class="muted">الحفظ يتم من خلال API آمن ثم يُحدّث الكتالوج المركزي للموقع والـAPK.</div></div><div class="toolbar"><button class="button dark" onclick="newProduct()">+ إضافة منتج</button><button class="button light" onclick="adminLogout()">تسجيل خروج</button></div></div><div id="products" class="products"></div><div id="status" class="status"></div></div><div class="panel" id="editor" hidden><h2 id="editorTitle">إضافة منتج</h2><div class="grid"><div class="field"><label>اسم المنتج</label><input id="name"></div><div class="field"><label>القسم</label><select id="category"><option value="tshirt">T-Shirt</option><option value="shirt">Shirt</option><option value="shorts">Shorts</option><option value="pants">Pants</option><option value="hoodie">Hoodie</option><option value="last">Last Piece</option></select></div><div class="field"><label>السعر بالجنيه</label><input id="price" type="number" min="0"></div><div class="field"><label>السعر القديم</label><input id="oldPrice" type="number" min="0"></div><div class="field"><label>المقاسات</label><input id="sizes" placeholder="M, L, XL, 2XL"></div><div class="field"><label>الألوان</label><input id="colors" placeholder="Black, White"></div><div class="field"><label>المخزون / القطع</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label>صورة المنتج من الموبايل</label><input id="imageFile" type="file" accept="image/*" onchange="previewImage()"><img id="preview" class="preview" hidden></div><div class="field full"><label>أو رابط الصورة</label><input id="image"></div><div class="field full"><label>وصف قصير</label><textarea id="note"></textarea></div><label class="check"><input id="lastPieces" type="checkbox"> آخر قطع</label><label class="check"><input id="active" type="checkbox" checked> ظاهر في المتجر</label></div><div class="toolbar" style="margin-top:15px"><button class="button dark" onclick="saveProduct()">حفظ وتحديث الموقع + APK</button><button class="button light" onclick="closeEditor()">إلغاء</button></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
let sb=null,authSession=null;
async function initAdminAuth(){try{const c=await fetch('/api/public-config',{cache:'no-store'}).then(r=>r.json());sb=supabase.createClient(c.supabaseUrl,c.supabasePublishableKey);authSession=(await sb.auth.getSession()).data.session;if(authSession&&await checkAdmin()){await openManager()}}catch(e){}}
async function checkAdmin(){if(!sb||!authSession)return false;const {data}=await sb.rpc('is_admin');return !!data}
async function adminLogin(){const email=document.getElementById('adminEmail').value.trim(),password=document.getElementById('adminPassword').value;const {data,error}=await sb.auth.signInWithPassword({email,password});authSession=data?.session||null;if(error||!await checkAdmin()){document.getElementById('loginStatus').innerHTML='<span class="err">بيانات الدخول غير صحيحة أو الحساب غير مصرح له.</span>';if(authSession)await sb.auth.signOut();authSession=null;return}await openManager()}
async function openManager(){adminKey='';document.getElementById('loginPanel').hidden=true;document.getElementById('manager').hidden=false;try{products=await api('GET');render()}catch(e){document.getElementById('status').innerHTML='<span class="err">تعذر تحميل المنتجات.</span>'}}
async function adminLogout(){if(sb)await sb.auth.signOut();location.reload()}
const API='/api/products';let products=[],editingId=null,adminKey='';const $=id=>document.getElementById(id);window.addEventListener('DOMContentLoaded',initAdminAuth);async function api(method='GET',body=null){const headers={'Accept':'application/json'};if(method!=='GET')headers['Content-Type']='application/json';if(authSession?.access_token)headers['Authorization']='Bearer '+authSession.access_token;else if(adminKey)headers['x-admin-key']=adminKey;const r=await fetch(API,{method,headers,body:body?JSON.stringify(body):undefined,cache:'no-store'});let data=null;try{data=await r.json()}catch{}if(!r.ok)throw new Error(data?.error||'API error');return data}async function connect(){adminKey=$('adminKey').value.trim();if(!adminKey)return $('loginStatus').textContent='أدخل كلمة مرور الإدارة أولًا.';try{products=await api('GET');$('loginPanel').hidden=true;$('manager').hidden=false;render()}catch(e){$('loginStatus').innerHTML='<span class="err">فشل الدخول. تأكد من كلمة المرور وإعداد الخادم.</span>'}}function render(){const root=$('products');if(!products.length){root.innerHTML='<div class="empty">لا توجد منتجات.</div>';return}root.innerHTML=products.map(p=>`<div class="product"><div class="thumb">${p.image?`<img src="${escAttr(p.image)}" alt="">`:'BLNK'}</div><div><h3 style="margin:0">${esc(p.name)}</h3><div class="meta">EGP ${Number(p.price).toLocaleString()} · ${esc(p.category)} · المخزون ${p.stock??0}</div><div class="meta">${(p.sizes||[]).map(esc).join(', ')} · ${(p.colors||[]).map(esc).join(', ')}</div></div><div class="actions"><button class="button light" onclick="editProduct('${escAttr(p.id)}')">تعديل</button><button class="button danger" onclick="removeProduct('${escAttr(p.id)}')">حذف</button></div></div>`).join('')}function newProduct(){editingId=null;$('editorTitle').textContent='إضافة منتج';['name','price','oldPrice','sizes','colors','stock','image','note'].forEach(id=>$(id).value='');$('stock').value=0;$('lastPieces').checked=false;$('active').checked=true;$('preview').hidden=true;$('imageFile').value='';$('editor').hidden=false}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('editorTitle').textContent='تعديل المنتج';$('name').value=p.name;$('category').value=p.category;$('price').value=p.price;$('oldPrice').value=p.oldPrice??'';$('sizes').value=(p.sizes||[]).join(', ');$('colors').value=(p.colors||[]).join(', ');$('stock').value=p.stock??0;$('image').value=p.image||'';$('note').value=p.note||'';$('lastPieces').checked=!!p.lastPieces;$('active').checked=p.active!==false;$('preview').hidden=!p.image;$('preview').src=p.image||'';$('imageFile').value='';$('editor').hidden=false}function closeEditor(){$('editor').hidden=true}function previewImage(){const f=$('imageFile').files[0];if(!f)return;compressImage(f).then(x=>{$('preview').src=x;$('preview').hidden=false})}function compressImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}async function saveProduct(){try{let image=$('image').value.trim();const f=$('imageFile').files[0];if(f)image=await compressImage(f);const id=editingId||('product-'+Date.now()),p={id,name:$('name').value.trim(),category:$('category').value,price:Number($('price').value||0),oldPrice:$('oldPrice').value?Number($('oldPrice').value):null,sizes:csv($('sizes').value),colors:csv($('colors').value),stock:Number($('stock').value||0),image,note:$('note').value.trim(),lastPieces:$('lastPieces').checked,active:$('active').checked};if(!p.name)return $('status').textContent='اكتب اسم المنتج.';const i=products.findIndex(x=>x.id===id);if(i>=0)products[i]=p;else products.push(p);const result=await api('PUT',products);products=result.products||products;closeEditor();render();$('status').innerHTML='<span class="ok">تم الحفظ وتحديث الكتالوج.</span>'}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}async function removeProduct(id){if(!confirm('حذف المنتج؟'))return;try{products=products.filter(p=>p.id!==id);const result=await api('PUT',products);products=result.products||products;render();$('status').innerHTML='<span class="ok">تم الحذف وتحديث الكتالوج.</span>'}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}function csv(v){return v.split(',').map(x=>x.trim()).filter(Boolean)}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function escAttr(v){return esc(v).replace(/`/g,'&#096;')}</script></body></html>
